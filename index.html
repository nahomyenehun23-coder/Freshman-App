<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Freshman Read-Only Course Viewer</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        * {
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-touch-callout: none !important;
            outline: none !important;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05070f !important;
            color: #f8fafc !important;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            touch-action: pan-x pan-y !important;
        }
        .text-gradient {
            background: linear-gradient(to right, #00f2fe, #ff007f, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .glass-effect {
            background: rgba(15, 17, 35, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        ::-webkit-scrollbar {
            width: 3px;
        }
        ::-webkit-scrollbar-track {
            background: #0f1123;
        }
        ::-webkit-scrollbar-thumb {
            background: #6366f1;
            border-radius: 10px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideOut {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(-30px); }
        }
        .course-card {
            animation: slideIn 0.3s ease-out;
        }
        @supports (padding: max(0px)) {
            .safe-top { padding-top: max(env(safe-area-inset-top), 16px); }
            .safe-bottom { padding-bottom: max(env(safe-area-inset-bottom), 16px); }
        }
        .loader {
            border: 3px solid #1e293b;
            border-top: 3px solid #6366f1;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* PDF Viewer Container - Full Touch Support */
        #pdf-viewer-container {
            background: #0a0c1a;
            overflow: hidden;
            height: 100%;
            width: 100%;
            position: relative;
            touch-action: pan-x pan-y pinch-zoom !important;
            -webkit-overflow-scrolling: touch;
        }
        
        /* PDF Iframe - Touch Enabled */
        #pdf-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #0a0c1a;
            touch-action: pan-x pan-y pinch-zoom !important;
            -webkit-overflow-scrolling: touch;
            transition: transform 0.1s ease-out;
        }
        
        /* Scroll Button */
        .scroll-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 999;
            background: rgba(99, 102, 241, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            touch-action: manipulation;
        }
        .scroll-btn:active {
            transform: scale(0.85);
        }
        .scroll-btn.show {
            display: flex;
            animation: fadeIn 0.3s ease-out;
        }
        
        /* Fullscreen Mode */
        .fullscreen-mode header,
        .fullscreen-mode footer,
        .fullscreen-mode .pdf-controls,
        .fullscreen-mode #close-viewer-btn {
            display: none !important;
        }
        .fullscreen-mode #screen-pdf-viewer {
            padding: 0 !important;
            height: 100vh !important;
            width: 100vw !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            z-index: 1000 !important;
            background: #0a0c1a !important;
            border-radius: 0 !important;
            margin: 0 !important;
            max-width: 100% !important;
            max-height: 100% !important;
            animation: fadeIn 0.3s ease-out;
        }
        .fullscreen-mode #screen-pdf-viewer > div:first-child {
            display: none !important;
        }
        .fullscreen-mode #pdf-viewer-container {
            border-radius: 0 !important;
            border: none !important;
            height: 100% !important;
        }
        .fullscreen-mode .scroll-btn {
            bottom: 30px;
            right: 30px;
        }
        
        /* Exit Fullscreen Button */
        .exit-fullscreen-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1001;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 10px 16px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            touch-action: manipulation;
        }
        .exit-fullscreen-btn:active {
            transform: scale(0.9);
        }
        .exit-fullscreen-btn.show {
            display: flex;
            animation: fadeIn 0.3s ease-out;
        }
        
        /* Dashboard */
        .dashboard-container {
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 12px;
            padding-bottom: 80px;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }
        
        /* Zoom Controls - Touch Friendly */
        .pdf-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 6px 10px;
            background: rgba(15, 17, 35, 0.95);
            border-bottom: 1px solid #1e293b;
            flex-wrap: wrap;
            flex-shrink: 0;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .pdf-controls button {
            padding: 6px 12px;
            border-radius: 10px;
            background: rgba(30, 41, 59, 0.8);
            color: #f8fafc;
            border: 1px solid rgba(51, 65, 85, 0.5);
            font-size: 11px;
            font-weight: bold;
            transition: all 0.2s;
            min-height: 32px;
            touch-action: manipulation;
            cursor: pointer;
        }
        .pdf-controls button:active {
            transform: scale(0.9);
            background: rgba(99, 102, 241, 0.3);
        }
        .pdf-controls span {
            color: #94a3b8;
            font-size: 10px;
            padding: 0 4px;
        }
        
        /* Gesture Indicator */
        .gesture-indicator {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 10px;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .gesture-indicator.show {
            opacity: 1;
        }
        
        /* Responsive */
        @media (max-width: 480px) {
            .pdf-controls button {
                font-size: 10px;
                padding: 4px 10px;
                min-height: 28px;
            }
            .scroll-btn {
                width: 38px;
                height: 38px;
                font-size: 16px;
                bottom: 15px;
                right: 15px;
            }
            .exit-fullscreen-btn {
                padding: 8px 12px;
                font-size: 10px;
                top: 15px;
                right: 15px;
            }
        }
    </style>
</head>
<body>

    <div id="app-root" class="relative h-screen flex flex-col max-w-md mx-auto bg-[#05070f]">
        
        <!-- HEADER -->
        <header class="sticky top-0 z-40 glass-effect border-b border-slate-900/50 p-3 safe-top flex-shrink-0">
            <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-2">
                    <button id="sidebar-toggle-btn" class="p-1.5 rounded-xl bg-slate-900/50 border border-slate-800/40 active:scale-95 transition-all touch-manipulation">
                        <svg class="w-5 h-5 text-[#00f2fe]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                    <h1 class="text-base font-black text-gradient tracking-tight">FreshmanHub</h1>
                </div>
                <button id="theme-toggle-btn" class="p-1.5 rounded-xl bg-slate-900/50 border border-slate-800/40 transition-all text-sm active:scale-95 touch-manipulation">
                    🌙
                </button>
            </div>
            <div id="search-box-container" class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400 text-xs">🔍</span>
                <input type="text" id="course-filter-input" placeholder="ኮርሶችን ይፍለጉ (Search courses...)" 
                       class="w-full pl-8 pr-3 py-1.5 bg-[#05070f] border border-slate-800 rounded-lg focus:border-[#00f2fe] text-xs font-medium transition-all text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-[#00f2fe]/50">
            </div>
        </header>

        <!-- SIDEBAR -->
        <div id="sidebar-backdrop" class="fixed inset-0 bg-black/80 z-50 opacity-0 pointer-events-none transition-opacity duration-300"></div>
        <aside id="sidebar-panel" class="fixed top-0 bottom-0 left-0 w-72 max-w-[75vw] bg-[#0f1123] z-50 transform -translate-x-full transition-transform duration-300 ease-out border-r border-slate-900 flex flex-col shadow-2xl">
            <div class="p-4 border-b border-slate-900 flex items-center justify-between safe-top">
                <span class="font-black text-sm text-gradient">የኮርሶች ዝርዝር</span>
                <button id="sidebar-close-btn" class="text-slate-400 text-sm p-1.5 hover:text-white transition-colors touch-manipulation">✕</button>
            </div>
            <nav id="sidebar-links-target" class="flex-1 overflow-y-auto p-3 space-y-1.5 safe-bottom"></nav>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 relative overflow-hidden">
            <!-- Dashboard -->
            <div id="screen-dashboard" class="dashboard-container">
                <div class="p-3 rounded-xl border border-[#6366f1]/30 bg-gradient-to-br from-[#6366f1]/20 to-[#ff007f]/5 mb-3 animate-fadeIn">
                    <h2 class="text-xs font-bold text-white">ሰላም ለእናንተ ይሁን 👋</h2>
                    <p class="text-[10px] text-slate-400 mt-1 leading-relaxed">ለዩኒቨርሲቲ አንደኛ አመት ተማሪዎች የተዘጋጁ የትምህርት ማጠቃለያዎች።</p>
                </div>
                <div id="dashboard-grid-container" class="grid grid-cols-1 gap-2"></div>
            </div>

            <!-- PDF VIEWER - Full Touch Support -->
            <div id="screen-pdf-viewer" class="hidden flex flex-col h-full w-full bg-[#0a0c1a]">
                <div class="flex items-center justify-between bg-[#0f1123] p-2 border-b border-slate-900 flex-shrink-0">
                    <button id="close-viewer-btn" class="flex items-center gap-1 text-xs font-bold text-[#00f2fe] active:scale-95 transition-all touch-manipulation">
                        ⬅ ወደ ኋላ
                    </button>
                    <span id="active-course-banner-text" class="text-[10px] font-bold text-slate-400 truncate max-w-[120px]">Course</span>
                    <button id="fullscreen-toggle-btn" class="text-xs text-slate-400 hover:text-white active:scale-95 transition-all touch-manipulation">
                        ⛶ ሙሉ ማያ
                    </button>
                </div>
                
                <!-- Touch Controls -->
                <div class="pdf-controls">
                    <button id="zoom-in-btn">🔍+</button>
                    <button id="zoom-out-btn">🔍−</button>
                    <button id="reset-zoom-btn">⟲</button>
                    <span id="view-status">🔒 ተጠብቋል</span>
                    <span id="zoom-level" class="text-[9px] text-slate-500">100%</span>
                </div>

                <!-- Loading -->
                <div id="pdf-loader" class="flex-1 flex items-center justify-center bg-black/40">
                    <div class="text-center">
                        <div class="loader mx-auto mb-3"></div>
                        <p class="text-slate-400 text-xs">⏳ እየተከፈተ ነው...</p>
                        <p class="text-slate-600 text-[9px] mt-1">👆 ወደ ላይ/ታች ይሸብልሉ</p>
                    </div>
                </div>

                <!-- PDF Viewer Container - Touch Enabled -->
                <div id="pdf-viewer-container" class="flex-1 bg-[#0a0c1a] relative overflow-hidden">
                    <iframe id="pdf-iframe" src="" class="w-full h-full" allow="autoplay" loading="eager" 
                            sandbox="allow-same-origin allow-scripts allow-forms allow-popups">
                    </iframe>
                    <div id="drive-blocker" class="absolute inset-0 z-10 pointer-events-none"></div>
                </div>
            </div>
        </main>

        <!-- SCROLL BUTTONS -->
        <button id="scroll-top-btn" class="scroll-btn" aria-label="Scroll to top">↑</button>
        <button id="scroll-bottom-btn" class="scroll-btn" style="bottom: 80px;" aria-label="Scroll to bottom">↓</button>

        <!-- GESTURE INDICATOR -->
        <div id="gesture-indicator" class="gesture-indicator">👆 ይሸብልሉ / ያስፉ</div>

        <!-- EXIT FULLSCREEN BUTTON -->
        <button id="exit-fullscreen-btn" class="exit-fullscreen-btn">
            ✕ ሙሉ ማያ ውጣ
        </button>

        <footer class="p-2 text-center border-t border-slate-900 bg-slate-950/20 flex-shrink-0 safe-bottom">
            <p class="text-[8px] font-mono tracking-wider text-slate-600">🔒 PROTECTED BY ENCRYPTED READ-ONLY ENGINE</p>
        </footer>
    </div>

    <script>
        // ============================================
        // PREVENT SCREEN DIMMING
        // ============================================
        function keepScreenAwake() {
            if ('wakeLock' in navigator) {
                try {
                    navigator.wakeLock.request('screen').then(lock => {
                        setTimeout(() => { lock.release(); keepScreenAwake(); }, 30000);
                    }).catch(() => {});
                } catch (e) {}
            }
        }

        // ============================================
        // COURSE DATA
        // ============================================
        const APPLICATION_LOCAL_DATABASE = [
            { id: "logic", name: "Logic and Critical Thinking", amharicName: "ሎጂክ እና ሂሳባዊ አስተሳሰብ", emoji: "🧠", url: "https://drive.google.com/file/d/1ALxgT1Uy7GgzpgAqfYejyfbpo1XMw9Rp/preview" },
            { id: "psychology", name: "Psychology", amharicName: "ሳይኮሎጂ", emoji: "👥", url: "https://drive.google.com/file/d/1DFuPHZtj1YWyH0xq8Dp6Il24ice54O1p/preview" },
            { id: "anthropology", name: "Anthropology", amharicName: "አንትሮፖሎጂ", emoji: "🦴", url: "https://drive.google.com/file/d/1h8sNuyWE2ANft8JF7e4LugefEFSeBga8/preview" },
            { id: "economics", name: "Economics", amharicName: "ኢኮኖሚክስ", emoji: "📈", url: "https://drive.google.com/file/d/1TlcMXFBfeM8Eg0Bf5Ij_jJvNXzydGCvL/preview" },
            { id: "emerging_tech", name: "Emerging Technology", amharicName: "ኤመርጂንግ ቴክኖሎጂ", emoji: "🤖", url: "https://drive.google.com/file/d/1HiwRvpQqsOOVrf6badGtwI7RSzvYO14w/preview" },
            { id: "global_trends", name: "Global Trends", amharicName: "ግሎባል ትሬንድስ", emoji: "🌍", url: "https://drive.google.com/file/d/15g-oc_cc3O-qAJwCS_pvT_pk96-QTkk-/preview" },
            { id: "civics", name: "Civics", amharicName: "ሲቪክስና ስነ-ዜጋ", emoji: "⚖️", url: "https://drive.google.com/file/d/1nXGQV88ovouctmtLX4uqG6fXWYSZRJIx/preview" }
        ];

        // ============================================
        // DOM REFERENCES
        // ============================================
        const dashboardGrid = document.getElementById('dashboard-grid-container');
        const sidebarLinksTarget = document.getElementById('sidebar-links-target');
        const searchInput = document.getElementById('course-filter-input');
        const viewDashboard = document.getElementById('screen-dashboard');
        const viewPdfViewer = document.getElementById('screen-pdf-viewer');
        const activeCourseText = document.getElementById('active-course-banner-text');
        const pdfLoader = document.getElementById('pdf-loader');
        const pdfIframe = document.getElementById('pdf-iframe');
        const viewerContainer = document.getElementById('pdf-viewer-container');
        const driveBlocker = document.getElementById('drive-blocker');
        const viewStatus = document.getElementById('view-status');
        const zoomLevel = document.getElementById('zoom-level');
        const scrollTopBtn = document.getElementById('scroll-top-btn');
        const scrollBottomBtn = document.getElementById('scroll-bottom-btn');
        const exitFullscreenBtn = document.getElementById('exit-fullscreen-btn');
        const fullscreenToggleBtn = document.getElementById('fullscreen-toggle-btn');
        const gestureIndicator = document.getElementById('gesture-indicator');

        // ============================================
        // STATE
        // ============================================
        let currentCourse = null;
        let currentZoom = 1;
        let isFullscreen = false;
        let pdfLoaded = false;
        let touchStartX = 0;
        let touchStartY = 0;
        let touchStartZoom = 1;
        let lastTouchDistance = 0;

        // ============================================
        // PRELOAD PDF
        // ============================================
        function preloadPdf(url) {
            const link = document.createElement('link');
            link.rel = 'preload';
            link.as = 'document';
            link.href = url;
            document.head.appendChild(link);
            
            const preconnect = document.createElement('link');
            preconnect.rel = 'preconnect';
            preconnect.href = 'https://drive.google.com';
            document.head.appendChild(preconnect);
        }
        APPLICATION_LOCAL_DATABASE.forEach(course => preloadPdf(course.url));

        // ============================================
        // OPEN COURSE VIEWER
        // ============================================
        function openCourseViewer(course) {
            currentCourse = course;
            pdfLoaded = false;
            
            viewDashboard.classList.add('hidden');
            viewPdfViewer.classList.remove('hidden');
            activeCourseText.innerText = `${course.emoji} ${course.name}`;
            
            pdfLoader.classList.remove('hidden');
            pdfIframe.style.display = 'none';
            
            currentZoom = 1;
            pdfIframe.style.transform = 'scale(1)';
            pdfIframe.style.transformOrigin = 'top left';
            zoomLevel.textContent = '100%';
            
            // Load PDF
            pdfIframe.src = course.url;
            
            pdfIframe.onload = function() {
                pdfLoaded = true;
                pdfLoader.classList.add('hidden');
                pdfIframe.style.display = 'block';
                
                setTimeout(() => {
                    driveBlocker.classList.add('pointer-events-auto');
                }, 500);
                
                viewStatus.textContent = '🔒 ተጠብቋል';
                scrollTopBtn.classList.add('show');
                scrollBottomBtn.classList.add('show');
                
                // Show gesture indicator
                showGestureIndicator('👆 ይሸብልሉ / ያስፉ');
            };
            
            setTimeout(() => {
                if (!pdfLoaded) {
                    pdfLoader.classList.add('hidden');
                    pdfIframe.style.display = 'block';
                    driveBlocker.classList.add('pointer-events-auto');
                }
            }, 3000);
        }

        // ============================================
        // GESTURE INDICATOR
        // ============================================
        function showGestureIndicator(text) {
            gestureIndicator.textContent = text;
            gestureIndicator.classList.add('show');
            setTimeout(() => {
                gestureIndicator.classList.remove('show');
            }, 3000);
        }

        // ============================================
        // ZOOM FUNCTIONS
        // ============================================
        function updateZoom(scale) {
            currentZoom = Math.min(Math.max(scale, 0.5), 3);
            pdfIframe.style.transform = `scale(${currentZoom})`;
            pdfIframe.style.transformOrigin = 'top left';
            zoomLevel.textContent = `${Math.round(currentZoom * 100)}%`;
            viewStatus.textContent = `🔍 ${Math.round(currentZoom * 100)}%`;
        }

        function zoomIn() {
            updateZoom(currentZoom + 0.1);
        }

        function zoomOut() {
            updateZoom(currentZoom - 0.1);
        }

        function resetZoom() {
            updateZoom(1);
            viewStatus.textContent = '🔒 ተጠብቋል';
        }

        // ============================================
        // TOUCH GESTURES - Pinch to Zoom & Swipe
        // ============================================
        function setupTouchGestures() {
            let initialPinchDistance = 0;
            let initialZoom = 1;
            let isPinching = false;
            
            viewerContainer.addEventListener('touchstart', function(e) {
                if (e.touches.length === 2) {
                    // Pinch start
                    const touch1 = e.touches[0];
                    const touch2 = e.touches[1];
                    initialPinchDistance = Math.hypot(
                        touch1.clientX - touch2.clientX,
                        touch1.clientY - touch2.clientY
                    );
                    initialZoom = currentZoom;
                    isPinching = true;
                    showGestureIndicator('🤏 ያስፉ (Pinch to zoom)');
                } else if (e.touches.length === 1) {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                }
            }, { passive: true });

            viewerContainer.addEventListener('touchmove', function(e) {
                if (e.touches.length === 2 && isPinching) {
                    e.preventDefault();
                    
                    const touch1 = e.touches[0];
                    const touch2 = e.touches[1];
                    const currentDistance = Math.hypot(
                        touch1.clientX - touch2.clientX,
                        touch1.clientY - touch2.clientY
                    );
                    
                    const scale = currentDistance / initialPinchDistance;
                    const newZoom = Math.min(Math.max(initialZoom * scale, 0.5), 3);
                    
                    pdfIframe.style.transform = `scale(${newZoom})`;
                    pdfIframe.style.transformOrigin = 'top left';
                    currentZoom = newZoom;
                    zoomLevel.textContent = `${Math.round(newZoom * 100)}%`;
                    
                    viewStatus.textContent = `🔍 ${Math.round(newZoom * 100)}%`;
                }
            }, { passive: false });

            viewerContainer.addEventListener('touchend', function(e) {
                if (isPinching) {
                    isPinching = false;
                    // Show zoom level after pinch
                    setTimeout(() => {
                        viewStatus.textContent = currentZoom === 1 ? '🔒 ተጠብቋል' : `🔍 ${Math.round(currentZoom * 100)}%`;
                    }, 500);
                }
            }, { passive: true });

            // Double tap to reset zoom
            let lastTapTime = 0;
            viewerContainer.addEventListener('touchstart', function(e) {
                if (e.touches.length === 1) {
                    const currentTime = new Date().getTime();
                    const tapLength = currentTime - lastTapTime;
                    if (tapLength < 300 && tapLength > 0) {
                        // Double tap detected
                        if (currentZoom !== 1) {
                            resetZoom();
                            showGestureIndicator('⟲ ወደ መደበኛ ተመለሰ');
                        } else {
                            zoomIn();
                            showGestureIndicator('🔍 አስፋ (Zoom in)');
                        }
                        e.preventDefault();
                    }
                    lastTapTime = currentTime;
                }
            }, { passive: false });
        }

        // ============================================
        // FULLSCREEN TOGGLE
        // ============================================
        function toggleFullscreen() {
            isFullscreen = !isFullscreen;
            
            if (isFullscreen) {
                document.body.classList.add('fullscreen-mode');
                exitFullscreenBtn.classList.add('show');
                fullscreenToggleBtn.textContent = '⛶ ሙሉ';
                scrollTopBtn.classList.remove('show');
                scrollBottomBtn.classList.remove('show');
                showGestureIndicator('⛶ ሙሉ ማያ ሁነታ');
            } else {
                document.body.classList.remove('fullscreen-mode');
                exitFullscreenBtn.classList.remove('show');
                fullscreenToggleBtn.textContent = '⛶ ሙሉ ማያ';
                if (pdfLoaded) {
                    scrollTopBtn.classList.add('show');
                    scrollBottomBtn.classList.add('show');
                }
            }
        }

        // ============================================
        // SCROLL FUNCTIONS
        // ============================================
        function scrollToTop() {
            const container = document.querySelector('.dashboard-container') || document.body;
            container.scrollTo({ top: 0, behavior: 'smooth' });
            showGestureIndicator('⬆ ወደ ላይ');
        }

        function scrollToBottom() {
            const container = document.querySelector('.dashboard-container') || document.body;
            container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
            showGestureIndicator('⬇ ወደ ታች');
        }

        // ============================================
        // DASHBOARD MOUNT
        // ============================================
        function mountDashboardInterface(query = '') {
            dashboardGrid.innerHTML = '';
            const normalizedQuery = query.toLowerCase().trim();
            
            const filteredCourses = APPLICATION_LOCAL_DATABASE.filter(course => 
                course.name.toLowerCase().includes(normalizedQuery) || 
                course.amharicName.includes(normalizedQuery)
            );

            if (filteredCourses.length === 0) {
                dashboardGrid.innerHTML = `
                    <div class="p-6 text-center rounded-xl bg-[#0f1123] border border-slate-900">
                        <p class="text-slate-400 text-xs">😕 ምንም ኮርስ አልተገኘም</p>
                    </div>
                `;
                return;
            }

            filteredCourses.forEach((course, index) => {
                const uiTileNode = document.createElement('div');
                uiTileNode.className = `course-card p-3 rounded-xl bg-[#0f1123] border border-slate-900 flex items-center justify-between cursor-pointer active:scale-[0.95] transition-all duration-200 shadow-md group hover:border-[#00f2fe]/60`;
                uiTileNode.style.animationDelay = `${index * 0.05}s`;
                
                uiTileNode.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="text-xl p-1.5 rounded-lg bg-slate-900 border border-slate-800/40">${course.emoji}</div>
                        <div>
                            <h4 class="text-xs font-bold text-slate-100 group-hover:text-[#00f2fe] transition-colors">${course.name}</h4>
                            <p class="text-[9px] text-slate-400 mt-0.5">${course.amharicName}</p>
                        </div>
                    </div>
                    <span class="text-[#00f2fe] font-bold text-[10px] opacity-70 group-hover:opacity-100 transition-opacity">📖</span>
                `;
                
                uiTileNode.addEventListener('click', () => openCourseViewer(course));
                dashboardGrid.appendChild(uiTileNode);
            });
        }

        // ============================================
        // SIDEBAR NAVIGATION
        // ============================================
        function mountSidebarNavigation() {
            sidebarLinksTarget.innerHTML = '';
            
            APPLICATION_LOCAL_DATABASE.forEach(course => {
                const navRowElement = document.createElement('button');
                navRowElement.className = "w-full text-left p-2.5 rounded-xl bg-slate-900/20 hover:bg-slate-800/50 border border-slate-800/40 transition-all flex items-center gap-2.5 active:scale-[0.95]";
                navRowElement.innerHTML = `
                    <span class="text-lg">${course.emoji}</span>
                    <span class="text-xs font-bold text-slate-300 truncate flex-1">${course.name}</span>
                    <span class="text-[9px] text-slate-500">→</span>
                `;
                navRowElement.addEventListener('click', () => {
                    toggleSidebar(false);
                    openCourseViewer(course);
                });
                sidebarLinksTarget.appendChild(navRowElement);
            });
        }

        // ============================================
        // SIDEBAR TOGGLE
        // ============================================
        function toggleSidebar(show) {
            const sidebar = document.getElementById('sidebar-panel');
            const backdrop = document.getElementById('sidebar-backdrop');
            
            if (show) {
                sidebar.classList.remove('-translate-x-full');
                backdrop.classList.remove('opacity-0', 'pointer-events-none');
                document.body.style.overflow = 'hidden';
            } else {
                sidebar.classList.add('-translate-x-full');
                backdrop.classList.add('opacity-0', 'pointer-events-none');
                document.body.style.overflow = '';
            }
        }

        // ============================================
        // THEME TOGGLE
        // ============================================
        let isDarkTheme = true;

        function toggleTheme() {
            const btn = document.getElementById('theme-toggle-btn');
            const body = document.body;
            const appRoot = document.getElementById('app-root');
            
            if (isDarkTheme) {
                btn.textContent = '☀️';
                body.style.backgroundColor = '#f1f5f9';
                body.style.color = '#0f172a';
                appRoot.style.backgroundColor = '#f1f5f9';
                appRoot.style.borderColor = '#e2e8f0';
                isDarkTheme = false;
            } else {
                btn.textContent = '🌙';
                body.style.backgroundColor = '#05070f';
                body.style.color = '#f8fafc';
                appRoot.style.backgroundColor = '#05070f';
                appRoot.style.borderColor = '#1e293b';
                isDarkTheme = true;
            }
        }

        // ============================================
        // TELEGRAM WEBAPP
        // ============================================
        function initTelegramWebApp() {
            if (window.Telegram && window.Telegram.WebApp) {
                try {
                    Telegram.WebApp.ready();
                    Telegram.WebApp.expand();
                    Telegram.WebApp.enableClosingConfirmation();
                    console.log('✅ Telegram WebApp initialized');
                } catch (error) {
                    console.warn('⚠️ Telegram WebApp error:', error);
                }
            }
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================
        function setupEventListeners() {
            searchInput.addEventListener('input', (e) => {
                mountDashboardInterface(e.target.value);
            });

            document.getElementById('sidebar-toggle-btn').addEventListener('click', () => toggleSidebar(true));
            document.getElementById('sidebar-close-btn').addEventListener('click', () => toggleSidebar(false));
            document.getElementById('sidebar-backdrop').addEventListener('click', () => toggleSidebar(false));

            document.getElementById('close-viewer-btn').addEventListener('click', () => {
                viewPdfViewer.classList.add('hidden');
                viewDashboard.classList.remove('hidden');
                pdfIframe.src = '';
                pdfIframe.style.display = 'none';
                driveBlocker.classList.remove('pointer-events-auto');
                currentZoom = 1;
                pdfLoaded = false;
                document.body.classList.remove('fullscreen-mode');
                exitFullscreenBtn.classList.remove('show');
                fullscreenToggleBtn.textContent = '⛶ ሙሉ ማያ';
                scrollTopBtn.classList.remove('show');
                scrollBottomBtn.classList.remove('show');
                mountDashboardInterface(searchInput.value);
            });

            document.getElementById('theme-toggle-btn').addEventListener('click', toggleTheme);

            // Zoom controls
            document.getElementById('zoom-in-btn').addEventListener('click', zoomIn);
            document.getElementById('zoom-out-btn').addEventListener('click', zoomOut);
            document.getElementById('reset-zoom-btn').addEventListener('click', resetZoom);

            // Fullscreen
            fullscreenToggleBtn.addEventListener('click', toggleFullscreen);
            exitFullscreenBtn.addEventListener('click', toggleFullscreen);

            // Scroll buttons
            scrollTopBtn.addEventListener('click', scrollToTop);
            scrollBottomBtn.addEventListener('click', scrollToBottom);

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (!viewPdfViewer.classList.contains('hidden')) {
                    if (e.key === '+' || e.key === '=') zoomIn();
                    if (e.key === '-') zoomOut();
                    if (e.key === '0') resetZoom();
                    if (e.key === 'f' || e.key === 'F') toggleFullscreen();
                }
                if (e.key === 'Escape') {
                    if (!document.getElementById('sidebar-panel').classList.contains('-translate-x-full')) {
                        toggleSidebar(false);
                    }
                    if (!viewPdfViewer.classList.contains('hidden')) {
                        if (isFullscreen) {
                            toggleFullscreen();
                        } else {
                            document.getElementById('close-viewer-btn').click();
                        }
                    }
                }
            });

            // Dashboard scroll
            const dashboard = document.getElementById('screen-dashboard');
            dashboard.addEventListener('scroll', () => {
                if (dashboard.scrollTop > 100) {
                    scrollTopBtn.classList.add('show');
                } else {
                    scrollTopBtn.classList.remove('show');
                }
                if (dashboard.scrollTop < dashboard.scrollHeight - dashboard.clientHeight - 100) {
                    scrollBottomBtn.classList.add('show');
                } else {
                    scrollBottomBtn.classList.remove('show');
                }
            });

            // Setup touch gestures
            setupTouchGestures();
        }

        // ============================================
        // INITIALIZE
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            keepScreenAwake();
            initTelegramWebApp();
            mountDashboardInterface('');
            mountSidebarNavigation();
            setupEventListeners();
            
            console.log('✅ FreshmanHub initialized - Full Touch Support');
            console.log('📚 7 Courses loaded');
            console.log('👆 Pinch to zoom, Swipe to scroll');
            console.log('💡 Screen wake lock active');
        });
    </script>
</body>
</html>
