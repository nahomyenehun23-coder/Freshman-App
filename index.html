<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Freshman Read-Only Course Viewer</title>
    <!-- Stable Tailwind CSS for Premium Gen-Z UI -->
    <script src="https://tailwindcss.com"></script>
    <style>
        /* 🛡️ ULTRA ABSOLUTE HIGH-SECURITY ENCRYPTED LAYER STYLING */
        * {
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-touch-callout: none !important;
            outline: none !important;
            -webkit-tap-highlight-color: transparent;
        }
        body { 
            overflow-x: hidden; 
            touch-action: pan-y; 
            background-color: #05070f !important; 
            color: #f8fafc !important; 
        }
        iframe {
            pointer-events: auto !important;
        }
        .text-gradient {
            background: linear-gradient(to right, #00f2fe, #ff007f, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-[#05070f] text-slate-100 font-sans">

    <div id="app-root" class="relative min-h-screen flex flex-col max-w-md mx-auto shadow-2xl border-x border-slate-900/60 bg-[#05070f]">
        
        <!-- HEADER DESIGN MODULE -->
        <header class="sticky top-0 z-40 backdrop-blur-xl bg-[#0f1123]/90 border-b border-slate-900/50 p-4">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-3">
                    <button id="sidebar-toggle-btn" class="p-2 rounded-xl bg-slate-900/50 border border-slate-800/40 active:scale-95 transition-all">
                        <svg class="w-5 h-5 text-[#00f2fe]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    </button>
                    <h1 class="text-lg font-black text-gradient tracking-tight">FreshmanHub</h1>
                </div>
                <button id="theme-toggle-btn" class="p-2 rounded-xl bg-slate-900/50 border border-slate-800/40 transition-all text-base active:scale-95">🌙</button>
            </div>
            <div id="search-box-container" class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">🔍</span>
                <input type="text" id="course-filter-input" placeholder="ኮርሶችን ይፈልጉ (Search courses...)" class="w-full pl-9 pr-4 py-2 bg-[#05070f] border border-slate-800 rounded-xl focus:border-[#00f2fe] text-xs font-medium transition-all text-slate-200">
            </div>
        </header>

        <!-- SIDEBAR CONTAINER MODULE -->
        <div id="sidebar-backdrop" class="fixed inset-0 bg-black/80 z-50 opacity-0 pointer-events-none transition-opacity duration-300"></div>
        <aside id="sidebar-panel" class="fixed top-0 bottom-0 left-0 w-72 max-w-[75vw] bg-[#0f1123] z-50 transform -translate-x-full transition-transform duration-300 ease-out border-r border-slate-900 flex flex-col shadow-2xl">
            <div class="p-4 border-b border-slate-900 flex items-center justify-between">
                <span class="font-black text-sm text-gradient">የኮርሶች ዝርዝር</span>
                <button id="sidebar-close-btn" class="text-slate-400 text-sm p-1.5">✕</button>
            </div>
            <nav id="sidebar-links-target" class="flex-1 overflow-y-auto p-3 space-y-1.5"></nav>
        </aside>

        <!-- VIEWPORT ENGINE BODY LAYER -->
        <main class="flex-1 p-4 relative z-10">
            <!-- 7ቱ ኮርሶች ማሳያ ዋና ገጽ (Dashboard) -->
            <div id="screen-dashboard" class="space-y-4">
                <div class="p-4 rounded-2xl border border-[#6366f1]/30 bg-gradient-to-br from-[#6366f1]/20 to-[#ff007f]/5">
                    <h2 class="text-sm font-bold text-white">ሰላም ለእናንተ ይሁን 👋</h2>
                    <p class="text-[11px] text-slate-400 mt-1 leading-relaxed">ለዩኒቨርሲቲ አንደኛ አመት ተማሪዎች የተዘጋጁ የትምህርት ማጠቃለያዎች። ፋይሎችን ኮፒ ማድረግ ወይም ማውረድ በጥብቅ የተከለከለ ነው።</p>
                </div>
                <div id="dashboard-grid-container" class="grid grid-cols-1 gap-3"></div>
            </div>

            <!-- 100% SECURE EMBEDDED HIGH-PERFORMANCE PDF PREVIEW ENGINE -->
            <div id="screen-pdf-viewer" class="hidden space-y-3 h-[calc(100vh-140px)] flex flex-col">
                <div class="flex items-center justify-between bg-[#0f1123] p-2.5 rounded-xl border border-slate-900">
                    <button id="close-viewer-btn" class="flex items-center gap-1 text-xs font-bold text-[#00f2fe] active:scale-95 transition-transform">⬅ ወደ ኋላ መመለሻ</button>
                    <span id="active-course-banner-text" class="text-[11px] font-bold text-slate-400 truncate max-w-[160px]">Course</span>
                </div>
                
                <!-- Highly Secured Google Document Frame Preview Frame Grid -->
                <div class="flex-1 w-full bg-black/40 rounded-xl overflow-hidden border border-slate-800">
                    <iframe id="secure-google-preview-frame" src="" class="w-full h-full border-0" allow="autoplay"></iframe>
                </div>
            </div>
        </main>

        <footer class="p-3 text-center border-t border-slate-900 bg-slate-950/20">
            <p class="text-[9px] font-mono tracking-wider text-slate-600">🔒 PROTECTED BY ENCRYPTED READ-ONLY ENGINE</p>
        </footer>
    </div>

    <script>
        // 7ቱ ኮርሶች በቀጥታ በእርስዎ እውነተኛ የጉግል ድራይቭ ኦሪጅናል ቪው ሊንኮች ተስተካክለዋል
        const APPLICATION_LOCAL_DATABASE = [
            { id: "logic", name: "Logic and Critical Thinking", amharicName: "ሎጂክ እና ሂሳባዊ አስተሳሰብ", emoji: "🧠", url: "https://google.com" },
            { id: "psychology", name: "Psychology", amharicName: "ሳይኮሎጂ (የስነ-ልቦና ትምህርት)", emoji: "👥", url: "https://google.com" },
            { id: "anthropology", name: "Anthropology", amharicName: "አንትሮፖሎጂ (የሰው ልጅ አመጣጥ ስነ-ባህል)", emoji: "🦴", url: "https://google.com" },
            { id: "economics", name: "Economics", amharicName: "ኢኮኖሚክስ (የምጣኔ ሀብት ትምህርት)", emoji: "📈", url: "https://google.com" },
            { id: "emerging_tech", name: "Emerging Technology", amharicName: "ኤመርጂንግ ቴክኖሎጂ (አዳዲስ ቴክኖሎጂዎች)", emoji: "🤖", url: "https://google.com" },
            { id: "global_trends", name: "Global Trends", amharicName: "ግሎባል ትሬንድስ (አለም አቀፋዊ ሁኔታዎች)", emoji: "🌍", url: "https://google.com" },
            { id: "civics", name: "Civics", amharicName: "ሲቪክስና ስነ-ዜጋ", emoji: "⚖️", url: "https://google.com" }
        ];

        const dashboardGrid = document.getElementById('dashboard-grid-container');
        const sidebarLinksTarget = document.getElementById('sidebar-links-target');
        const searchInput = document.getElementById('course-filter-input');
        const viewDashboard = document.getElementById('screen-dashboard');
        const viewPdfViewer = document.getElementById('screen-pdf-viewer');
        const wrapperSearchBox = document.getElementById('search-box-container');
        const secureFrame = document.getElementById('secure-google-preview-frame');
        const activeCourseText = document.getElementById('active-course-banner-text');

        function mountDashboardInterface(query = '') {
            dashboardGrid.innerHTML = '';
            const normalizedQuery = query.toLowerCase();
            const parsedMatches = APPLICATION_LOCAL_DATABASE.filter(course => 
                course.name.toLowerCase().includes(normalizedQuery) || course.amharicName.includes(query)
            );
            parsedMatches.forEach(course => {
                const uiTileNode = document.createElement('div');
                uiTileNode.className = "p-4 rounded-xl bg-[#0f1123] border border-slate-900 flex items-center justify-between cursor-pointer active:scale-[0.98] transition-all duration-200 shadow-md group hover:border-[#00f2fe]/60";
                uiTileNode.innerHTML = `
                    <div class="flex items-center gap-3.5">
                        <div class="text-2xl p-2 rounded-lg bg-slate-900 border border-slate-800/40">${course.emoji}</div>
                        <div>
                            <h4 class="text-sm font-bold text-slate-100 group-hover:text-[#00f2fe] transition-colors">${course.name}</h4>
                            <p class="text-[10px] text-slate-400 mt-0.5">${course.amharicName}</p>
                        </div>
                    </div>
                    <span class="text-[#00f2fe] font-bold text-xs opacity-70 group-hover:opacity-100">📖 አንብብ</span>
                `;
                uiTileNode.addEventListener('click', () => {
                    viewDashboard.classList.add('hidden');
                    wrapperSearchBox.classList.add('hidden');
                    viewPdfViewer.classList.remove('hidden');
                    activeCourseText.innerText = `${course.emoji} ${course.name}`;
                    secureFrame.src = course.url; // Load the secure Google Preview Layout flawlessly
                });
                dashboardGrid.appendChild(uiTileNode);
            });
        }

        function mountSidebarNavigation() {
            sidebarLinksTarget.innerHTML = '';
            APPLICATION_LOCAL_DATABASE.forEach(course => {
                const navRowElement = document.createElement('button');
