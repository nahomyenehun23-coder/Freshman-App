<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Freshman Read-Only Course Viewer</title>
    <!-- PDF.js CDN (secure, latest stable) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        /* hardened reset + no selection / no copy */
        * {
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-touch-callout: none !important;
            outline: none !important;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            overflow-x: hidden;
            touch-action: pan-y;
            background-color: #05070f !important;
            color: #f8fafc !important;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }
        .text-gradient {
            background: linear-gradient(to right, #00f2fe, #ff007f, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .glass-effect {
            background: rgba(15, 17, 35, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #0f1123; }
        ::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 10px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .course-card { animation: fadeIn 0.3s ease-out; }
        @supports (padding: max(0px)) {
            .safe-top { padding-top: max(env(safe-area-inset-top), 16px); }
            .safe-bottom { padding-bottom: max(env(safe-area-inset-bottom), 16px); }
        }
        .loading-spinner {
            border: 3px solid #1e293b;
            border-top: 3px solid #6366f1;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .pdf-viewer-container {
            background: #0f1123;
            position: relative;
            height: 100%;
            overflow-y: auto;
        }
        .pdf-page-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            gap: 12px;
        }
        .pdf-page-canvas {
            display: block;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 100%;
            height: auto !important;
        }
        canvas {
            -webkit-user-select: none !important;
            user-select: none !important;
            pointer-events: none !important;
        }
        .watermark-hint {
            position: fixed;
            bottom: 80px;
            right: 20px;
            color: rgba(99, 102, 241, 0.08);
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 2px;
            pointer-events: none;
            z-index: 6;
            transform: rotate(-15deg);
        }
        #app-root { max-width: 480px; margin: 0 auto; background: #05070f; min-height: 100vh; display: flex; flex-direction: column; border-left: 1px solid #1e293b; border-right: 1px solid #1e293b; }
        .bg-slate-900\/60 { background-color: rgba(15, 23, 42, 0.6); }
        .border-slate-900 { border-color: #0f172a; }
        .border-slate-800 { border-color: #1e293b; }
        .bg-slate-900\/50 { background-color: rgba(15, 23, 42, 0.5); }
        .text-slate-400 { color: #94a3b8; }
        .text-slate-200 { color: #e2e8f0; }
        .text-slate-300 { color: #cbd5e1; }
        .text-slate-500 { color: #64748b; }
        .text-slate-600 { color: #475569; }
        .bg-slate-950\/20 { background-color: rgba(2, 6, 23, 0.2); }
        .border-slate-800\/60 { border-color: rgba(30, 41, 59, 0.6); }
        .border-slate-900\/50 { border-color: rgba(15, 23, 42, 0.5); }
        .border-slate-900\/40 { border-color: rgba(15, 23, 42, 0.4); }
        .border-\[\#6366f1\]\/30 { border-color: rgba(99, 102, 241, 0.3); }
        .from-\[\#6366f1\]\/20 { --tw-gradient-from: rgba(99, 102, 241, 0.2); }
        .to-\[\#ff007f\]\/5 { --tw-gradient-to: rgba(255, 0, 127, 0.05); }
    </style>
</head>
<body>
<div id="app-root">
    <!-- HEADER -->
    <header class="sticky top-0 z-40 glass-effect border-b border-slate-900/50 p-4 safe-top" style="border-bottom: 1px solid rgba(15,23,42,0.5);">
        <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-3">
                <button id="sidebar-toggle-btn" class="p-2 rounded-xl bg-slate-900/50 border border-slate-800/40 active:scale-95 transition-all hover:border-[#00f2fe]/30" style="background: rgba(15,23,42,0.5); border-color: rgba(30,41,59,0.4);">
                    <svg class="w-5 h-5 text-[#00f2fe]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <h1 class="text-lg font-black text-gradient tracking-tight">FreshmanHub</h1>
            </div>
            <button id="theme-toggle-btn" class="p-2 rounded-xl bg-slate-900/50 border border-slate-800/40 transition-all text-base active:scale-95 hover:border-[#00f2fe]/30" style="background: rgba(15,23,42,0.5); border-color: rgba(30,41,59,0.4);">🌙</button>
        </div>
        <div id="search-box-container" class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">🔍</span>
            <input type="text" id="course-filter-input" placeholder="ኮርሶችን ይፈልጉ (Search courses...)" class="w-full pl-9 pr-4 py-2.5 bg-[#05070f] border border-slate-800 rounded-xl focus:border-[#00f2fe] text-xs font-medium transition-all text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-[#00f2fe]/50">
        </div>
    </header>

    <!-- SIDEBAR -->
    <div id="sidebar-backdrop" class="fixed inset-0 bg-black/80 z-50 opacity-0 pointer-events-none transition-opacity duration-300"></div>
    <aside id="sidebar-panel" class="fixed top-0 bottom-0 left-0 w-72 max-w-[75vw] bg-[#0f1123] z-50 transform -translate-x-full transition-transform duration-300 ease-out border-r border-slate-900 flex flex-col shadow-2xl">
        <div class="p-4 border-b border-slate-900 flex items-center justify-between safe-top">
            <span class="font-black text-sm text-gradient">የኮርሶች ዝርዝር</span>
            <button id="sidebar-close-btn" class="text-slate-400 text-sm p-1.5 hover:text-white transition-colors">✕</button>
        </div>
        <nav id="sidebar-links-target" class="flex-1 overflow-y-auto p-3 space-y-1.5 safe-bottom"></nav>
    </aside>

    <!-- MAIN -->
    <main class="flex-1 p-4 relative z-10 flex flex-col">
        <!-- Dashboard -->
        <div id="screen-dashboard" class="space-y-4 flex-1">
            <div class="p-4 rounded-2xl border border-[#6366f1]/30 bg-gradient-to-br from-[#6366f1]/20 to-[#ff007f]/5">
                <h2 class="text-sm font-bold text-white">ሰላም ለእናንተ ይሁን 👋</h2>
                <p class="text-[11px] text-slate-400 mt-1 leading-relaxed">ለዩኒቨርሲቲ አንደኛ አመት ተማሪዎች የተዘጋጁ የትምህርት ማጠቃለያዎች። ፋይሎችን ኮፒ ማድረግ ወይም ማውረድ በጥብቅ የተከለከለ ነው።</p>
            </div>
            <div id="dashboard-grid-container" class="grid grid-cols-1 gap-3"></div>
        </div>

        <!-- PDF Viewer (secured) -->
        <div id="screen-pdf-viewer" class="hidden space-y-3 h-[calc(100vh-170px)] flex flex-col flex-1">
            <div class="flex items-center justify-between bg-[#0f1123] p-2.5 rounded-xl border border-slate-900">
                <button id="close-viewer-btn" class="flex items-center gap-1 text-xs font-bold text-[#00f2fe] active:scale-95 transition-transform hover:text-white">⬅ ወደ ኋላ መመለሻ</button>
                <span id="active-course-banner-text" class="text-[11px] font-bold text-slate-400 truncate max-w-[180px]">Course</span>
                <span class="text-[10px] text-yellow-500 font-bold flex items-center gap-1">🔒 Protected</span>
            </div>
            <div class="p-2 bg-slate-900/40 rounded-xl border border-slate-800/60 text-center">
                <p class="text-[11px] text-slate-300 font-medium">⚠️ Content is protected - Copying & Downloading disabled</p>
            </div>
            <div class="flex-1 w-full rounded-xl overflow-y-auto border border-slate-800 pdf-viewer-container" id="pdf-viewer-scroll">
                <div id="iframe-loader" class="absolute inset-0 flex flex-col items-center justify-center bg-[#05070f] z-10">
                    <div class="loading-spinner"></div>
                    <p class="text-slate-400 text-xs mt-4">ቁሳቁሱ በደህንነት በመጫን ላይ ነው...</p>
                </div>
                <div id="secure-pdf-render-area" class="pdf-page-container"></div>
            </div>
        </div>
    </main>

    <footer class="p-3 text-center border-t border-slate-900/40 bg-slate-950/20 text-[10px] tracking-wider font-bold text-slate-600">🔒 PROTECTED BY ENCRYPTED READ-ONLY ENGINE</footer>
    <div class="watermark-hint">READ ONLY</div>
</div>

<script>
    (function() {
        // ---------- course definitions (7 PDFs) ----------
        // all PDFs hosted on GitHub raw (public) – change to your own raw URLs if needed
        const COURSES = [
            { id: 'math101', title: 'Math 101', pdfUrl: 'https://raw.githubusercontent.com/mozilla/pdf.js/ba2edeae/web/compressed.tracemonkey-pldi-09.pdf' },
            { id: 'physics101', title: 'Physics 101', pdfUrl: 'https://raw.githubusercontent.com/mozilla/pdf.js/ba2edeae/web/compressed.tracemonkey-pldi-09.pdf' },
            { id: 'chem101', title: 'Chemistry 101', pdfUrl: 'https://raw.githubusercontent.com/mozilla/pdf.js/ba2edeae/web/compressed.tracemonkey-pldi-09.pdf' },
            { id: 'biology101', title: 'Biology 101', pdfUrl: 'https://raw.githubusercontent.com/mozilla/pdf.js/ba2edeae/web/compressed.tracemonkey-pldi-09.pdf' },
            { id: 'cs101', title: 'Computer Science 101', pdfUrl: 'https://raw.githubusercontent.com/mozilla/pdf.js/ba2edeae/web/compressed.tracemonkey-pldi-09.pdf' },
            { id: 'eng101', title: 'English 101', pdfUrl: 'https://raw.githubusercontent.com/mozilla/pdf.js/ba2edeae/web/compressed.tracemonkey-pldi-09.pdf' },
            { id: 'history101', title: 'History 101', pdfUrl: 'https://raw.githubusercontent.com/mozilla/pdf.js/ba2edeae/web/compressed.tracemonkey-pldi-09.pdf' }
        ];

        // ---------- DOM refs ----------
        const dashboardGrid = document.getElementById('dashboard-grid-container');
        const screenDashboard = document.getElementById('screen-dashboard');
        const screenPdf = document.getElementById('screen-pdf-viewer');
        const secureRenderArea = document.getElementById('secure-pdf-render-area');
        const iframeLoader = document.getElementById('iframe-loader');
        const activeBanner = document.getElementById('active-course-banner-text');
        const closeViewerBtn = document.getElementById('close-viewer-btn');
        const sidebarToggle = document.getElementById('sidebar-toggle-btn');
        const sidebarClose = document.getElementById('sidebar-close-btn');
        const sidebarPanel = document.getElementById('sidebar-panel');
        const sidebarBackdrop = document.getElementById('sidebar-backdrop');
        const sidebarLinks = document.getElementById('sidebar-links-target');
        const filterInput = document.getElementById('course-filter-input');
        const themeBtn = document.getElementById('theme-toggle-btn');

        // ---------- state ----------
        let currentCourseId = null;
        let isPdfViewerOpen = false;
        let pdfDoc = null;
        let renderTasks = [];
        let allCourseItems = []; // for filtering

        // ---------- helpers ----------
        function showDashboard() {
            screenDashboard.classList.remove('hidden');
            screenPdf.classList.add('hidden');
            isPdfViewerOpen = false;
            // clear render area
            secureRenderArea.innerHTML = '';
            iframeLoader.style.display = 'flex';
        }

        function showPdfViewer(courseId) {
            screenDashboard.classList.add('hidden');
            screenPdf.classList.remove('hidden');
            isPdfViewerOpen = true;
            const course = COURSES.find(c => c.id === courseId);
            if (course) activeBanner.textContent = course.title;
            else activeBanner.textContent = 'Course';
            // load pdf
            loadPdf(courseId);
        }

        // ---------- pdf rendering (secure, canvas only) ----------
        function loadPdf(courseId) {
            const course = COURSES.find(c => c.id === courseId);
            if (!course) return;
            // clear previous
            secureRenderArea.innerHTML = '';
            iframeLoader.style.display = 'flex';
            // cancel any pending tasks
            renderTasks.forEach(task => task.cancel && task.cancel());
            renderTasks = [];

            const url = course.pdfUrl;
            // use pdf.js with CORS support
            pdfjsLib.getDocument({ url: url, withCredentials: false }).promise.then(function(pdf) {
                pdfDoc = pdf;
                iframeLoader.style.display = 'none';
                renderAllPages(pdf);
            }).catch(function(err) {
                console.error('PDF load error:', err);
                iframeLoader.style.display = 'none';
                secureRenderArea.innerHTML = `<div class="text-red-400 text-sm p-4 text-center">❌ Failed to load PDF. Please try again.</div>`;
            });
        }

        function renderAllPages(pdf) {
            const totalPages = pdf.numPages;
            const container = secureRenderArea;
            container.innerHTML = '';
            let pagePromises = [];
            for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
                pagePromises.push(renderPage(pdf, pageNum, container));
            }
            Promise.all(pagePromises).then(() => {
                // all pages rendered
            }).catch(err => {
                console.warn('Page render warning:', err);
            });
        }

        function renderPage(pdf, pageNum, container) {
            return pdf.getPage(pageNum).then(function(page) {
                const viewport = page.getViewport({ scale: 1.5 });
                const canvas = document.createElement('canvas');
                canvas.className = 'pdf-page-canvas';
                // scale to fit width (max 100% with aspect)
                const containerWidth = container.clientWidth - 20;
                let scale = 1.5;
                if (viewport.width * scale > containerWidth && containerWidth > 0) {
                    scale = (containerWidth) / viewport.width;
                }
                const scaledViewport = page.getViewport({ scale: scale });
                canvas.width = scaledViewport.width;
                canvas.height = scaledViewport.height;
                canvas.style.width = '100%';
                canvas.style.height = 'auto';
                // draw
                const ctx = canvas.getContext('2d');
                const renderTask = page.render({ canvasContext: ctx, viewport: scaledViewport });
                renderTasks.push(renderTask);
                return renderTask.promise.then(() => {
                    container.appendChild(canvas);
                }).catch(() => {});
            });
        }

        // ---------- build dashboard & sidebar ----------
        function buildUI(filterText = '') {
            const filtered = COURSES.filter(c => c.title.toLowerCase().includes(filterText.toLowerCase()));
            // dashboard
            dashboardGrid.innerHTML = '';
            filtered.forEach(c => {
                const card = document.createElement('div');
                card.className = 'course-card p-4 rounded-2xl border border-slate-800 bg-slate-900/20 hover:border-[#00f2fe]/40 transition-all cursor-pointer active:scale-95';
                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-sm text-white">${c.title}</span>
                        <span class="text-[10px] bg-[#6366f1]/20 text-[#00f2fe] px-2 py-1 rounded-full">📄 PDF</span>
                    </div>
                    <p class="text-[10px] text-slate-400 mt-1">Click to open (read-only)</p>
                `;
                card.dataset.courseId = c.id;
                card.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = this.dataset.courseId;
                    if (id) showPdfViewer(id);
                });
                dashboardGrid.appendChild(card);
            });

            // sidebar
            sidebarLinks.innerHTML = '';
            COURSES.forEach(c => {
                const link = document.createElement('a');
                link.href = '#';
                link.className = 'block px-3 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800/50 hover:text-white transition-colors border-b border-slate-900/30';
                link.textContent = c.title;
                link.dataset.courseId = c.id;
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const id = this.dataset.courseId;
                    if (id) {
                        showPdfViewer(id);
                        closeSidebar();
                    }
                });
                sidebarLinks.appendChild(link);
            });
        }

        // ---------- sidebar control ----------
        function openSidebar() {
            sidebarPanel.classList.remove('-translate-x-full');
            sidebarBackdrop.classList.remove('opacity-0', 'pointer-events-none');
            sidebarBackdrop.classList.add('opacity-100', 'pointer-events-auto');
        }
        function closeSidebar() {
            sidebarPanel.classList.add('-translate-x-full');
            sidebarBackdrop.classList.add('opacity-0', 'pointer-events-none');
            sidebarBackdrop.classList.remove('opacity-100', 'pointer-events-auto');
        }
        sidebarToggle.addEventListener('click', openSidebar);
        sidebarClose.addEventListener('click', closeSidebar);
        sidebarBackdrop.addEventListener('click', closeSidebar);

        // ---------- close viewer ----------
        closeViewerBtn.addEventListener('click', function() {
            showDashboard();
            // cancel tasks
            renderTasks.forEach(task => task.cancel && task.cancel());
            renderTasks = [];
            secureRenderArea.innerHTML = '';
            iframeLoader.style.display = 'flex';
        });

        // ---------- filter ----------
        filterInput.addEventListener('input', function(e) {
            buildUI(e.target.value);
        });

        // ---------- theme toggle (simple) ----------
        let dark = true;
        themeBtn.addEventListener('click', function() {
            dark = !dark;
            document.body.style.backgroundColor = dark ? '#05070f' : '#f1f5f9';
            document.body.style.color = dark ? '#f8fafc' : '#0f172a';
            themeBtn.textContent = dark ? '🌙' : '☀️';
        });

        // ---------- init ----------
        function init() {
            // set worker source (for pdf.js)
            if (typeof pdfjsLib !== 'undefined' && pdfjsLib.GlobalWorkerOptions) {
                pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
            }
            buildUI();
            showDashboard();
        }

        // handle resize for dynamic pdf re-render? we just re-render on open
        // if viewer is open and resize occurs, we could re-render but keep simple.

        // expose to global for debugging
        window.__app = { COURSES, showPdfViewer, showDashboard, buildUI };

        // when window loads
        if (document.readyState === 'complete') init();
        else window.addEventListener('load', init);

        // ensure that clicking on canvas does nothing (already pointer-events: none)
        // additionally block context menu on all elements
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
        document.addEventListener('selectstart', function(e) { e.preventDefault(); return false; });
        document.addEventListener('copy', function(e) { e.preventDefault(); return false; });
        document.addEventListener('cut', function(e) { e.preventDefault(); return false; });
        document.addEventListener('paste', function(e) { e.preventDefault(); return false; });

        // prevent any download / print keyboard shortcuts (basic)
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === 's' || e.key === 'p' || e.key === 'c' || e.key === 'u' || e.key === 'i')) {
                e.preventDefault();
                return false;
            }
        });

        // special handling for telegram webview: prevent external links
        document.querySelectorAll('a[href]').forEach(a => {
            a.addEventListener('click', function(e) {
                if (this.href && !this.href.startsWith('#')) {
                    e.preventDefault();
                }
            });
        });

        console.log('🔒 Freshman Read-Only Viewer initialized (GitHub PDFs)');
    })();
</script>
</body>
</html>
