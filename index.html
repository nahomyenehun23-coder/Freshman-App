<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Freshman Read-Only Course Viewer</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    
    <!-- PDF.js Engine Hook (ፒዲኤፉን ወደ ምስል ቀይሮ በሴኩሪቲ ለማሳየት) -->
    <script src="https://cloudflare.com"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cloudflare.com';
    </script>

    <style>
        /* ተማሪዎች ፅሁፍ እንዳይመርጡ፣ እንዳይገለብጡ (Copy) እና እንዳይጫኑ መከልከያ */
        * {
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-touch-callout: none !important;
            outline: none !important;
            -webkit-tap-highlight-color: transparent;
        }
        
        body { 
            overflow-x: hidden; 
            touch-action: pan-y; 
            background-color: #05070f !important; 
            color: #f8fafc !important; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }
        
        .text-gradient {
            background: linear-gradient(to right, #00f2fe, #ff007f, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .glass-effect {
            background: rgba(15, 17, 35, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0f1123;
        }
        ::-webkit-scrollbar-thumb {
            background: #6366f1;
            border-radius: 10px;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .course-card {
            animation: fadeIn 0.3s ease-out;
        }
        
        @supports (padding: max(0px)) {
            .safe-top {
                padding-top: max(env(safe-area-inset-top), 16px);
            }
            .safe-bottom {
                padding-bottom: max(env(safe-area-inset-bottom), 16px);
            }
        }
        
        .loading-spinner {
            border: 3px solid #1e293b;
            border-top: 3px solid #6366f1;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .pdf-viewer-container {
            background: #0f1123;
            position: relative;
            height: 100%;
            overflow-y: auto;
        }
        
        .pdf-page-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            gap: 12px;
        }
        
        .pdf-page-canvas {
            display: block;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 100%;
            height: auto !important;
        }
        
        canvas {
            -webkit-user-select: none !important;
            user-select: none !important;
            pointer-events: none !important;
        }
        
        .watermark-hint {
            position: fixed;
            bottom: 80px;
            right: 20px;
            color: rgba(99, 102, 241, 0.08);
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 2px;
            pointer-events: none;
            z-index: 6;
            transform: rotate(-15deg);
        }
    </style>
</head>
<body class="bg-[#05070f] text-slate-100">

    <div id="app-root" class="relative min-h-screen flex flex-col max-w-md mx-auto shadow-2xl border-x border-slate-900/60 bg-[#05070f]">
        
        <!-- HEADER -->
        <header class="sticky top-0 z-40 glass-effect border-b border-slate-900/50 p-4 safe-top">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-3">
                    <button id="sidebar-toggle-btn" class="p-2 rounded-xl bg-slate-900/50 border border-slate-800/40 active:scale-95 transition-all hover:border-[#00f2fe]/30">
                        <svg class="w-5 h-5 text-[#00f2fe]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                    <h1 class="text-lg font-black text-gradient tracking-tight">FreshmanHub</h1>
                </div>
                <button id="theme-toggle-btn" class="p-2 rounded-xl bg-slate-900/50 border border-slate-800/40 transition-all text-base active:scale-95 hover:border-[#00f2fe]/30">
                    🌙
                </button>
            </div>
            <div id="search-box-container" class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">🔍</span>
                <input type="text" id="course-filter-input" placeholder="ኮርሶችን ይፈልጉ (Search courses...)" 
                       class="w-full pl-9 pr-4 py-2.5 bg-[#05070f] border border-slate-800 rounded-xl focus:border-[#00f2fe] text-xs font-medium transition-all text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-[#00f2fe]/50">
            </div>
        </header>

        <!-- SIDEBAR -->
        <div id="sidebar-backdrop" class="fixed inset-0 bg-black/80 z-50 opacity-0 pointer-events-none transition-opacity duration-300"></div>
        <aside id="sidebar-panel" class="fixed top-0 bottom-0 left-0 w-72 max-w-[75vw] bg-[#0f1123] z-50 transform -translate-x-full transition-transform duration-300 ease-out border-r border-slate-900 flex flex-col shadow-2xl">
            <div class="p-4 border-b border-slate-900 flex items-center justify-between safe-top">
                <span class="font-black text-sm text-gradient">የኮርሶች ዝርዝር</span>
                <button id="sidebar-close-btn" class="text-slate-400 text-sm p-1.5 hover:text-white transition-colors">✕</button>
            </div>
            <nav id="sidebar-links-target" class="flex-1 overflow-y-auto p-3 space-y-1.5 safe-bottom"></nav>
        </aside>

        <!-- MAIN SCREENS -->
        <main class="flex-1 p-4 relative z-10 flex flex-col">
            
            <!-- Dashboard View -->
            <div id="screen-dashboard" class="space-y-4 flex-1">
                <div class="p-4 rounded-2xl border border-[#6366f1]/30 bg-gradient-to-br from-[#6366f1]/20 to-[#ff007f]/5">
                    <h2 class="text-sm font-bold text-white">ሰላም ለእናንተ ይሁን 👋</h2>
                    <p class="text-[11px] text-slate-400 mt-1 leading-relaxed">ለዩኒቨርሲቲ አንደኛ አመት ተማሪዎች የተዘጋጁ የትምህርት ማጠቃለያዎች። ፋይሎችን ኮፒ ማድረግ ወይም ማውረድ በጥብቅ የተከለከለ ነው።</p>
                </div>
                <div id="dashboard-grid-container" class="grid grid-cols-1 gap-3"></div>
            </div>

            <!-- Secured Read-Only Engine Canvas View -->
            <div id="screen-pdf-viewer" class="hidden space-y-3 h-[calc(100vh-170px)] flex flex-col flex-1">
                <div class="flex items-center justify-between bg-[#0f1123] p-2.5 rounded-xl border border-slate-900">
                    <button id="close-viewer-btn" class="flex items-center gap-1 text-xs font-bold text-[#00f2fe] active:scale-95 transition-transform hover:text-white">
                        ⬅ ወደ ኋላ መመለሻ
                    </button>
                    <span id="active-course-banner-text" class="text-[11px] font-bold text-slate-400 truncate max-w-[180px]">Course</span>
                    <span class="text-[10px] text-yellow-500 font-bold flex items-center gap-1">🔒 Protected</span>
                </div>
                
                <div class="p-2 bg-slate-900/40 rounded-xl border border-slate-800/60 text-center">
                    <p class="text-[11px] text-slate-300 font-medium">⚠️ Content is protected - Copying & Downloading disabled</p>
                </div>
                
                <!-- Secure Container Rendering Images Directly -->
                <div class="flex-1 w-full rounded-xl overflow-y-auto border border-slate-800 pdf-viewer-container">
                    <div id="iframe-loader" class="absolute inset-0 flex flex-col items-center justify-center bg-[#05070f] z-10">
                        <div class="loading-spinner"></div>
                        <p class="text-slate-400 text-xs mt-4">ቁሳቁሱ በደህንነት በመጫን ላይ ነው...</p>
                    </div>
                    
                    <!-- Flattened Canvas Target Area -->
                    <div id="secure-pdf-render-area" class="pdf-page-container"></div>
                </div>
            </div>
        </main>
        
        <footer class="p-3 text-center border-t border-slate-900/40 bg-slate-950/20 text-[10px] tracking-wider font-bold text-slate-600">
            🔒 PROTECTED BY ENCRYPTED READ-ONLY ENGINE
        </footer>
        
        <div class="watermark-hint">READ ONLY</div>
    </div>

    <!-- ENGINE CONTROL LOGIC JS -->
    <script>
        // የጫኗቸው የ 7ቱ ፒዲኤፍ ፋይሎች ዝርዝር (በትክክለኛው ስማቸው)
