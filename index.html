<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Freshman Read-Only Course Viewer</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * {
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-touch-callout: none !important;
            outline: none !important;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05070f !important;
            color: #f8fafc !important;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            touch-action: none !important;
        }
        .text-gradient {
            background: linear-gradient(to right, #00f2fe, #ff007f, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .glass-effect {
            background: rgba(15, 17, 35, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        ::-webkit-scrollbar {
            width: 0px;
            height: 0px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .course-card {
            animation: slideIn 0.3s ease-out;
        }
        @supports (padding: max(0px)) {
            .safe-top { padding-top: max(env(safe-area-inset-top), 16px); }
            .safe-bottom { padding-bottom: max(env(safe-area-inset-bottom), 16px); }
        }
        .loader {
            border: 3px solid #1e293b;
            border-top: 3px solid #6366f1;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* PDF Canvas Container - Full Touch Support */
        #pdf-canvas-container {
            background: #0a0c1a;
            overflow: hidden;
            height: 100%;
            width: 100%;
            position: relative;
            touch-action: none !important;
            -webkit-overflow-scrolling: touch;
        }
        
        #pdf-canvas-container canvas {
            display: block;
            margin: 0 auto;
            width: 100%;
            height: auto;
            touch-action: none !important;
            transition: transform 0.05s ease-out;
        }
        
        /* PDF Controls - Minimal */
        .pdf-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 6px 10px;
            background: rgba(15, 17, 35, 0.95);
            border-bottom: 1px solid #1e293b;
            flex-wrap: wrap;
            flex-shrink: 0;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .pdf-controls button {
            padding: 6px 12px;
            border-radius: 10px;
            background: rgba(30, 41, 59, 0.8);
            color: #f8fafc;
            border: 1px solid rgba(51, 65, 85, 0.5);
            font-size: 11px;
            font-weight: bold;
            transition: all 0.2s;
            min-height: 32px;
            touch-action: manipulation;
            cursor: pointer;
        }
        .pdf-controls button:active {
            transform: scale(0.9);
            background: rgba(99, 102, 241, 0.3);
        }
        .pdf-controls span {
            color: #94a3b8;
            font-size: 10px;
            padding: 0 4px;
        }
        .pdf-controls .page-info {
            color: #94a3b8;
            font-size: 10px;
            font-weight: bold;
            min-width: 60px;
            text-align: center;
        }
        
        /* Fullscreen Mode */
        .fullscreen-mode header,
        .fullscreen-mode footer,
        .fullscreen-mode .pdf-controls,
        .fullscreen-mode #close-viewer-btn {
            display: none !important;
        }
        .fullscreen-mode #screen-pdf-viewer {
            padding: 0 !important;
            height: 100vh !important;
            width: 100vw !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            z-index: 1000 !important;
            background: #0a0c1a !important;
            border-radius: 0 !important;
            margin: 0 !important;
            max-width: 100% !important;
            max-height: 100% !important;
            animation: fadeIn 0.3s ease-out;
        }
        .fullscreen-mode #pdf-canvas-container {
            border-radius: 0 !important;
            border: none !important;
            height: 100% !important;
        }
        
        /* Exit Fullscreen Button */
        .exit-fullscreen-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1001;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 10px 16px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            touch-action: manipulation;
        }
        .exit-fullscreen-btn:active {
            transform: scale(0.9);
        }
        .exit-fullscreen-btn.show {
            display: flex;
            animation: fadeIn 0.3s ease-out;
        }
        
        /* Dashboard */
        .dashboard-container {
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 12px;
            padding-bottom: 80px;
            -webkit-overflow-scrolling: touch;
        }
        
        /* Gesture Indicator */
        .gesture-indicator {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 18px;
            border-radius: 25px;
            font-size: 11px;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            max-width: 80%;
        }
        .gesture-indicator.show {
            opacity: 1;
        }
        
        /* Responsive */
        @media (max-width: 480px) {
            .pdf-controls button {
                font-size: 10px;
                padding: 4px 10px;
                min-height: 28px;
            }
            .exit-fullscreen-btn {
                padding: 8px 12px;
                font-size: 10px;
                top: 15px;
                right: 15px;
            }
        }
    </style>
</head>
<body>

    <div id="app-root" class="relative h-screen flex flex-col max-w-md mx-auto bg-[#05070f]">
        
        <!-- HEADER -->
        <header class="sticky top-0 z-40 glass-effect border-b border-slate-900/50 p-3 safe-top flex-shrink-0">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <button id="sidebar-toggle-btn" class="p-1.5 rounded-xl bg-slate-900/50 border border-slate-800/40 active:scale-95 transition-all touch-manipulation">
                        <svg class="w-5 h-5 text-[#00f2fe]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                    <h1 class="text-base font-black text-gradient tracking-tight">FreshmanHub</h1>
                </div>
                <div class="flex items-center gap-2">
                    <button id="theme-toggle-btn" class="p-1.5 rounded-xl bg-slate-900/50 border border-slate-800/40 transition-all text-sm active:scale-95 touch-manipulation">
                        🌙
                    </button>
                </div>
            </div>
        </header>

        <!-- SIDEBAR -->
        <div id="sidebar-backdrop" class="fixed inset-0 bg-black/80 z-50 opacity-0 pointer-events-none transition-opacity duration-300"></div>
        <aside id="sidebar-panel" class="fixed top-0 bottom-0 left-0 w-72 max-w-[75vw] bg-[#0f1123] z-50 transform -translate-x-full transition-transform duration-300 ease-out border-r border-slate-900 flex flex-col shadow-2xl">
            <div class="p-4 border-b border-slate-900 flex items-center justify-between safe-top">
                <span class="font-black text-sm text-gradient">የኮርሶች ዝርዝር</span>
                <button id="sidebar-close-btn" class="text-slate-400 text-sm p-1.5 hover:text-white transition-colors touch-manipulation">✕</button>
            </div>
            <nav id="sidebar-links-target" class="flex-1 overflow-y-auto p-3 space-y-1.5 safe-bottom"></nav>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 relative overflow-hidden">
            <!-- Dashboard -->
            <div id="screen-dashboard" class="dashboard-container">
                <div class="p-3 rounded-xl border border-[#6366f1]/30 bg-gradient-to-br from-[#6366f1]/20 to-[#ff007f]/5 mb-3">
                    <h2 class="text-xs font-bold text-white">ሰላም ለእናንተ ይሁን 👋</h2>
                    <p class="text-[10px] text-slate-400 mt-1 leading-relaxed">ለዩኒቨርሲቲ አንደኛ አመት ተማሪዎች የተዘጋጁ የትምህርት ማጠቃለያዎች።</p>
                </div>
                <div id="dashboard-grid-container" class="grid grid-cols-1 gap-2"></div>
            </div>

            <!-- PDF VIEWER - Canvas with Full Touch Support -->
            <div id="screen-pdf-viewer" class="hidden flex flex-col h-full w-full bg-[#0a0c1a]">
                <div class="flex items-center justify-between bg-[#0f1123] p-2 border-b border-slate-900 flex-shrink-0">
                    <button id="close-viewer-btn" class="flex items-center gap-1 text-xs font-bold text-[#00f2fe] active:scale-95 transition-all touch-manipulation">
                        ⬅ ወደ ኋላ
                    </button>
                    <span id="active-course-banner-text" class="text-[10px] font-bold text-slate-400 truncate max-w-[120px]">Course</span>
                    <button id="fullscreen-toggle-btn" class="text-xs text-slate-400 hover:text-white active:scale-95 transition-all touch-manipulation">
                        ⛶ ሙሉ ማያ
                    </button>
                </div>
                
                <!-- PDF Controls -->
                <div class="pdf-controls">
                    <button id="prev-page-btn">◀</button>
                    <span class="page-info" id="page-info">ገጽ 1 / 1</span>
                    <button id="next-page-btn">▶</button>
                    <button id="zoom-in-btn">🔍+</button>
                    <button id="zoom-out-btn">🔍−</button>
                    <button id="reset-zoom-btn">⟲</button>
                    <span id="zoom-level" class="text-[9px] text-slate-500">100%</span>
                </div>

                <!-- Loading -->
                <div id="pdf-loader" class="flex-1 flex items-center justify-center bg-black/40">
                    <div class="text-center">
                        <div class="loader mx-auto mb-3"></div>
                        <p class="text-slate-400 text-xs">⏳ እየተከፈተ ነው...</p>
                        <p class="text-slate-600 text-[9px] mt-1">👆 2 ጣቶች ይጠቀሙ (Use 2 fingers)</p>
                    </div>
                </div>

                <!-- PDF Canvas Container -->
                <div id="pdf-canvas-container" class="flex-1 bg-[#0a0c1a] relative overflow-hidden"></div>
            </div>
        </main>

        <!-- GESTURE INDICATOR -->
        <div id="gesture-indicator" class="gesture-indicator">👆 2 ጣቶች ይጠቀሙ (Use 2 fingers)</div>

        <!-- EXIT FULLSCREEN BUTTON -->
        <button id="exit-fullscreen-btn" class="exit-fullscreen-btn">
            ✕ ሙሉ ማያ ውጣ
        </button>

        <footer class="p-2 text-center border-t border-slate-900 bg-slate-950/20 flex-shrink-0 safe-bottom">
            <p class="text-[8px] font-mono tracking-wider text-slate-600">🔒 PROTECTED BY ENCRYPTED READ-ONLY ENGINE</p>
        </footer>
    </div>

    <script>
        // ============================================
        // PDF.js Configuration
        // ============================================
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // ============================================
        // PREVENT SCREEN DIMMING
        // ============================================
        function keepScreenAwake() {
            if ('wakeLock' in navigator) {
                try {
                    navigator.wakeLock.request('screen').then(lock => {
                        setTimeout(() => { lock.release(); keepScreenAwake(); }, 30000);
                    }).catch(() => {});
                } catch (e) {}
            }
        }

        // ============================================
        // COURSE DATA
        // ============================================
        const APPLICATION_LOCAL_DATABASE = [
            { id: "logic", name: "Logic and Critical Thinking", amharicName: "ሎጂክ እና ሂሳባዊ አስተሳሰብ", emoji: "🧠", fileId: "1ALxgT1Uy7GgzpgAqfYejyfbpo1XMw9Rp" },
            { id: "psychology", name: "Psychology", amharicName: "ሳይኮሎጂ", emoji: "👥", fileId: "1DFuPHZtj1YWyH0xq8Dp6Il24ice54O1p" },
            { id: "anthropology", name: "Anthropology", amharicName: "አንትሮፖሎጂ", emoji: "🦴", fileId: "1h8sNuyWE2ANft8JF7e4LugefEFSeBga8" },
            { id: "economics", name: "Economics", amharicName: "ኢኮኖሚክስ", emoji: "📈", fileId: "1TlcMXFBfeM8Eg0Bf5Ij_jJvNXzydGCvL" },
            { id: "emerging_tech", name: "Emerging Technology", amharicName: "ኤመርጂንግ ቴክኖሎጂ", emoji: "🤖", fileId: "1HiwRvpQqsOOVrf6badGtwI7RSzvYO14w" },
            { id: "global_trends", name: "Global Trends", amharicName: "ግሎባል ትሬንድስ", emoji: "🌍", fileId: "15g-oc_cc3O-qAJwCS_pvT_pk96-QTkk-" },
            { id: "civics", name: "Civics", amharicName: "ሲቪክስና ስነ-ዜጋ", emoji: "⚖️", fileId: "1nXGQV88ovouctmtLX4uqG6fXWYSZRJIx" }
        ];

        // ============================================
        // DOM REFERENCES
        // ============================================
        const dashboardGrid = document.getElementById('dashboard-grid-container');
        const sidebarLinksTarget = document.getElementById('sidebar-links-target');
        const viewDashboard = document.getElementById('screen-dashboard');
        const viewPdfViewer = document.getElementById('screen-pdf-viewer');
        const activeCourseText = document.getElementById('active-course-banner-text');
        const pdfLoader = document.getElementById('pdf-loader');
        const canvasContainer = document.getElementById('pdf-canvas-container');
        const pageInfo = document.getElementById('page-info');
        const zoomLevel = document.getElementById('zoom-level');
        const exitFullscreenBtn = document.getElementById('exit-fullscreen-btn');
        const fullscreenToggleBtn = document.getElementById('fullscreen-toggle-btn');
        const gestureIndicator = document.getElementById('gesture-indicator');

        // ============================================
        // STATE
        // ============================================
        let pdfDoc = null;
        let currentPage = 1;
        let totalPages = 0;
        let currentScale = 1.2;
        let currentCourse = null;
        let isFullscreen = false;
        let pdfLoaded = false;
        
        // Touch state
        let touchStartX = 0;
        let touchStartY = 0;
        let initialPinchDistance = 0;
        let initialZoom = 1;
        let isPinching = false;
        let isSwiping = false;
        let lastTouchY = 0;

        // ============================================
        // GET GOOGLE DRIVE PDF URL
        // ============================================
        function getGoogleDrivePdfUrl(fileId) {
            return `https://drive.google.com/uc?export=download&id=${fileId}`;
        }

        // ============================================
        // RENDER PDF PAGE TO CANVAS
        // ============================================
        function renderPage(pageNum, scale = currentScale) {
            if (!pdfDoc) return;

            // Remove existing canvas
            const existingCanvas = canvasContainer.querySelector('canvas');
            if (existingCanvas) {
                existingCanvas.remove();
            }

            // Create new canvas
            const canvas = document.createElement('canvas');
            canvasContainer.appendChild(canvas);
            canvas.style.touchAction = 'none';
            
            pdfDoc.getPage(pageNum).then(page => {
                const viewport = page.getViewport({ scale: scale });
                const context = canvas.getContext('2d');
                
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                canvas.style.width = '100%';
                canvas.style.height = 'auto';
                canvas.style.transform = 'scale(1)';
                canvas.style.transformOrigin = 'top left';
                
                const renderContext = {
                    canvasContext: context,
                    viewport: viewport
                };
                
                return page.render(renderContext).promise;
            }).then(() => {
                console.log(`✅ Page ${pageNum} rendered`);
                pageInfo.textContent = `ገጽ ${pageNum} / ${totalPages}`;
            }).catch(err => {
                console.error('❌ Render error:', err);
            });
        }

        // ============================================
        // LOAD PDF
        // ============================================
        function loadPdfFromDrive(fileId) {
            const url = getGoogleDrivePdfUrl(fileId);
            
            pdfjsLib.getDocument(url).promise.then(pdf => {
                pdfDoc = pdf;
                totalPages = pdf.numPages;
                pageInfo.textContent = `ገጽ 1 / ${totalPages}`;
                
                pdfLoader.classList.add('hidden');
                
                // Render all pages one by one
                renderPage(1);
                pdfLoaded = true;
                
                console.log(`✅ PDF loaded: ${totalPages} pages`);
                showGestureIndicator('👆 2 ጣቶች ይጠቀሙ (Use 2 fingers)');
            }).catch(err => {
                console.error('❌ Error loading PDF:', err);
                pdfLoader.classList.remove('hidden');
                pdfLoader.innerHTML = `
                    <div class="text-center p-6">
                        <div class="text-5xl mb-4">⚠️</div>
                        <p class="text-red-400 text-sm font-bold">ፒዲኤፍ መክፈት አልተቻለም</p>
                        <p class="text-slate-500 text-xs mt-2">${err.message || 'Failed to load PDF'}</p>
                        <div class="mt-4">
                            <button onclick="retryLoadPdf()" class="bg-[#6366f1] text-white px-6 py-2 rounded-xl text-sm font-bold active:scale-95 transition-all">
                                🔄 እንደገና ሞክር
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        // ============================================
        // RETRY LOAD
        // ============================================
        function retryLoadPdf() {
            if (!currentCourse) return;
            pdfLoader.classList.remove('hidden');
            pdfLoader.innerHTML = `
                <div class="text-center">
                    <div class="loader mx-auto mb-3"></div>
                    <p class="text-slate-400 text-xs">⏳ እንደገና እየሞከረ...</p>
                </div>
            `;
            canvasContainer.innerHTML = '';
            loadPdfFromDrive(currentCourse.fileId);
        }
        window.retryLoadPdf = retryLoadPdf;

        // ============================================
        // NAVIGATION FUNCTIONS
        // ============================================
        function prevPage() {
            if (currentPage <= 1 || !pdfDoc) return;
            currentPage--;
            renderPage(currentPage);
        }

        function nextPage() {
            if (currentPage >= totalPages || !pdfDoc) return;
            currentPage++;
            renderPage(currentPage);
        }

        function updateZoom(scale) {
            currentScale = Math.min(Math.max(scale, 0.5), 3);
            const canvas = canvasContainer.querySelector('canvas');
            if (canvas) {
                canvas.style.transform = `scale(${currentScale})`;
                canvas.style.transformOrigin = 'top left';
            }
            zoomLevel.textContent = `${Math.round(currentScale * 100)}%`;
        }

        function zoomIn() {
            updateZoom(currentScale + 0.1);
        }

        function zoomOut() {
            updateZoom(currentScale - 0.1);
        }

        function resetZoom() {
            updateZoom(1.2);
        }

        // ============================================
        // TOUCH GESTURES - Pinch & Swipe with 2 fingers
        // ============================================
        function setupTouchGestures() {
            let initialPinchDistance = 0;
            let initialZoom = 1;
            let isPinching = false;
            let touchCount = 0;

            canvasContainer.addEventListener('touchstart', function(e) {
                touchCount = e.touches.length;
                
                if (e.touches.length === 2) {
                    // Two fingers - Pinch or Swipe
                    const touch1 = e.touches[0];
                    const touch2 = e.touches[1];
                    initialPinchDistance = Math.hypot(
                        touch1.clientX - touch2.clientX,
                        touch1.clientY - touch2.clientY
                    );
                    initialZoom = currentScale;
                    isPinching = true;
                    isSwiping = false;
                    lastTouchY = (touch1.clientY + touch2.clientY) / 2;
                    showGestureIndicator('🤏 ያስፉ / ⬆⬇ ይሸብልሉ');
                } else if (e.touches.length === 1) {
                    // One finger - Single tap for page navigation
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                    isSwiping = false;
                    isPinching = false;
                }
            }, { passive: true });

            canvasContainer.addEventListener('touchmove', function(e) {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    
                    const touch1 = e.touches[0];
                    const touch2 = e.touches[1];
                    
                    // Check if it's a pinch or swipe
                    const currentDistance = Math.hypot(
                        touch1.clientX - touch2.clientX,
                        touch1.clientY - touch2.clientY
                    );
                    
                    const currentMidY = (touch1.clientY + touch2.clientY) / 2;
                    const deltaY = currentMidY - lastTouchY;
                    
                    // If distance changed significantly, it's a pinch
                    const distanceDiff = Math.abs(currentDistance - initialPinchDistance);
                    
                    if (distanceDiff > 10) {
                        // Pinch gesture
                        const scale = currentDistance / initialPinchDistance;
                        const newZoom = Math.min(Math.max(initialZoom * scale, 0.5), 3);
                        currentScale = newZoom;
                        const canvas = canvasContainer.querySelector('canvas');
                        if (canvas) {
                            canvas.style.transform = `scale(${newZoom})`;
                            canvas.style.transformOrigin = 'top left';
                        }
                        zoomLevel.textContent = `${Math.round(newZoom * 100)}%`;
                        isPinching = true;
                        isSwiping = false;
                    } else if (Math.abs(deltaY) > 20) {
                        // Swipe gesture - Scroll through pages
                        isSwiping = true;
                        isPinching = false;
                        
                        if (deltaY < -20 && currentPage < totalPages) {
                            // Swipe up - Next page
                            nextPage();
                            showGestureIndicator(`⬆ ገጽ ${currentPage + 1}`);
                            lastTouchY = currentMidY;
                            // Reset to prevent multiple triggers
                            setTimeout(() => {
                                isSwiping = false;
                            }, 300);
                        } else if (deltaY > 20 && currentPage > 1) {
                            // Swipe down - Previous page
                            prevPage();
                            showGestureIndicator(`⬇ ገጽ ${currentPage - 1}`);
                            lastTouchY = currentMidY;
                            setTimeout(() => {
                                isSwiping = false;
                            }, 300);
                        }
                    }
                } else if (e.touches.length === 1) {
                    // Single finger tap
                    const currentX = e.touches[0].clientX;
                    const currentY = e.touches[0].clientY;
                    const deltaX = currentX - touchStartX;
                    const deltaY = currentY - touchStartY;
                    
                    if (Math.abs(deltaX) > 50 && Math.abs(deltaX) > Math.abs(deltaY)) {
                        if (deltaX < -50) {
                            // Swipe left - Next page
                            nextPage();
                            showGestureIndicator(`⬅ ገጽ ${currentPage}`);
                        } else if (deltaX > 50) {
                            // Swipe right - Previous page
                            prevPage();
                            showGestureIndicator(`➡ ገጽ ${currentPage}`);
                        }
                    }
                }
            }, { passive: false });

            canvasContainer.addEventListener('touchend', function(e) {
                if (isPinching) {
                    isPinching = false;
                    setTimeout(() => {
                        gestureIndicator.classList.remove('show');
                    }, 1000);
                }
                if (isSwiping) {
                    isSwiping = false;
                }
            }, { passive: true });

            // Double tap to reset zoom
            let lastTapTime = 0;
            canvasContainer.addEventListener('touchstart', function(e) {
                if (e.touches.length === 1) {
                    const currentTime = new Date().getTime();
                    const tapLength = currentTime - lastTapTime;
                    if (tapLength < 300 && tapLength > 0) {
                        // Double tap detected
                        if (currentScale !== 1.2) {
                            resetZoom();
                            showGestureIndicator('⟲ ወደ መደበኛ ተመለሰ');
                        }
                        e.preventDefault();
                    }
                    lastTapTime = currentTime;
                }
            }, { passive: false });
        }

        // ============================================
        // GESTURE INDICATOR
        // ============================================
        function showGestureIndicator(text) {
            gestureIndicator.textContent = text;
            gestureIndicator.classList.add('show');
            clearTimeout(window.gestureTimeout);
            window.gestureTimeout = setTimeout(() => {
                gestureIndicator.classList.remove('show');
            }, 2000);
        }

        // ============================================
        // FULLSCREEN TOGGLE
        // ============================================
        function toggleFullscreen() {
            isFullscreen = !isFullscreen;
            
            if (isFullscreen) {
                document.body.classList.add('fullscreen-mode');
                exitFullscreenBtn.classList.add('show');
                fullscreenToggleBtn.textContent = '⛶ ሙሉ';
                showGestureIndicator('⛶ ሙሉ ማያ');
            } else {
                document.body.classList.remove('fullscreen-mode');
                exitFullscreenBtn.classList.remove('show');
                fullscreenToggleBtn.textContent = '⛶ ሙሉ ማያ';
            }
        }

        // ============================================
        // OPEN COURSE VIEWER
        // ============================================
        function openCourseViewer(course) {
            currentCourse = course;
            pdfLoaded = false;
            currentPage = 1;
            
            viewDashboard.classList.add('hidden');
            viewPdfViewer.classList.remove('hidden');
            activeCourseText.innerText = `${course.emoji} ${course.name}`;
            
            canvasContainer.innerHTML = '';
            
            pdfLoader.classList.remove('hidden');
            pdfLoader.innerHTML = `
                <div class="text-center">
                    <div class="loader mx-auto mb-3"></div>
                    <p class="text-slate-400 text-xs">⏳ እየተከፈተ ነው...</p>
                    <p class="text-slate-600 text-[9px] mt-1">👆 2 ጣቶች ይጠቀሙ (Use 2 fingers)</p>
                </div>
            `;
            
            // Reset zoom
            currentScale = 1.2;
            zoomLevel.textContent = '100%';
            
            loadPdfFromDrive(course.fileId);
        }

        // ============================================
        // DASHBOARD MOUNT
        // ============================================
        function mountDashboardInterface() {
            dashboardGrid.innerHTML = '';
            
            APPLICATION_LOCAL_DATABASE.forEach((course, index) => {
                const uiTileNode = document.createElement('div');
                uiTileNode.className = `course-card p-3 rounded-xl bg-[#0f1123] border border-slate-900 flex items-center justify-between cursor-pointer active:scale-[0.95] transition-all duration-200 shadow-md group hover:border-[#00f2fe]/60`;
                uiTileNode.style.animationDelay = `${index * 0.05}s`;
                
                uiTileNode.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="text-xl p-1.5 rounded-lg bg-slate-900 border border-slate-800/40">${course.emoji}</div>
                        <div>
                            <h4 class="text-xs font-bold text-slate-100 group-hover:text-[#00f2fe] transition-colors">${course.name}</h4>
                            <p class="text-[9px] text-slate-400 mt-0.5">${course.amharicName}</p>
                        </div>
                    </div>
                    <span class="text-[#00f2fe] font-bold text-[10px] opacity-70 group-hover:opacity-100 transition-opacity">📖</span>
                `;
                
                uiTileNode.addEventListener('click', () => openCourseViewer(course));
                dashboardGrid.appendChild(uiTileNode);
            });
        }

        // ============================================
        // SIDEBAR NAVIGATION
        // ============================================
        function mountSidebarNavigation() {
            sidebarLinksTarget.innerHTML = '';
            
            APPLICATION_LOCAL_DATABASE.forEach(course => {
                const navRowElement = document.createElement('button');
                navRowElement.className = "w-full text-left p-2.5 rounded-xl bg-slate-900/20 hover:bg-slate-800/50 border border-slate-800/40 transition-all flex items-center gap-2.5 active:scale-[0.95]";
                navRowElement.innerHTML = `
                    <span class="text-lg">${course.emoji}</span>
                    <span class="text-xs font-bold text-slate-300 truncate flex-1">${course.name}</span>
                    <span class="text-[9px] text-slate-500">→</span>
                `;
                navRowElement.addEventListener('click', () => {
                    toggleSidebar(false);
                    openCourseViewer(course);
                });
                sidebarLinksTarget.appendChild(navRowElement);
            });
        }

        // ============================================
        // SIDEBAR TOGGLE
        // ============================================
        function toggleSidebar(show) {
            const sidebar = document.getElementById('sidebar-panel');
            const backdrop = document.getElementById('sidebar-backdrop');
            
            if (show) {
                sidebar.classList.remove('-translate-x-full');
                backdrop.classList.remove('opacity-0', 'pointer-events-none');
                document.body.style.overflow = 'hidden';
            } else {
                sidebar.classList.add('-translate-x-full');
                backdrop.classList.add('opacity-0', 'pointer-events-none');
                document.body.style.overflow = '';
            }
        }

        // ============================================
        // THEME TOGGLE
        // ============================================
        let isDarkTheme = true;

        function toggleTheme() {
            const btn = document.getElementById('theme-toggle-btn');
            const body = document.body;
            const appRoot = document.getElementById('app-root');
            
            if (isDarkTheme) {
                btn.textContent = '☀️';
                body.style.backgroundColor = '#f1f5f9';
                body.style.color = '#0f172a';
                appRoot.style.backgroundColor = '#f1f5f9';
                appRoot.style.borderColor = '#e2e8f0';
                isDarkTheme = false;
            } else {
                btn.textContent = '🌙';
                body.style.backgroundColor = '#05070f';
                body.style.color = '#f8fafc';
                appRoot.style.backgroundColor = '#05070f';
                appRoot.style.borderColor = '#1e293b';
                isDarkTheme = true;
            }
        }

        // ============================================
        // TELEGRAM WEBAPP
        // ============================================
        function initTelegramWebApp() {
            if (window.Telegram && window.Telegram.WebApp) {
                try {
                    Telegram.WebApp.ready();
                    Telegram.WebApp.expand();
                    Telegram.WebApp.enableClosingConfirmation();
                    console.log('✅ Telegram WebApp initialized');
                } catch (error) {
                    console.warn('⚠️ Telegram WebApp error:', error);
                }
            }
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================
        function setupEventListeners() {
            document.getElementById('sidebar-toggle-btn').addEventListener('click', () => toggleSidebar(true));
            document.getElementById('sidebar-close-btn').addEventListener('click', () => toggleSidebar(false));
            document.getElementById('sidebar-backdrop').addEventListener('click', () => toggleSidebar(false));

            document.getElementById('close-viewer-btn').addEventListener('click', () => {
                viewPdfViewer.classList.add('hidden');
                viewDashboard.classList.remove('hidden');
                canvasContainer.innerHTML = '';
                pdfDoc = null;
                currentPage = 1;
                totalPages = 0;
                pdfLoaded = false;
                document.body.classList.remove('fullscreen-mode');
                exitFullscreenBtn.classList.remove('show');
                fullscreenToggleBtn.textContent = '⛶ ሙሉ ማያ';
                mountDashboardInterface();
            });

            document.getElementById('theme-toggle-btn').addEventListener('click', toggleTheme);

            // PDF Controls
            document.getElementById('prev-page-btn').addEventListener('click', prevPage);
            document.getElementById('next-page-btn').addEventListener('click', nextPage);
            document.getElementById('zoom-in-btn').addEventListener('click', zoomIn);
            document.getElementById('zoom-out-btn').addEventListener('click', zoomOut);
            document.getElementById('reset-zoom-btn').addEventListener('click', resetZoom);

            // Fullscreen
            fullscreenToggleBtn.addEventListener('click', toggleFullscreen);
            exitFullscreenBtn.addEventListener('click', toggleFullscreen);

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (!viewPdfViewer.classList.contains('hidden')) {
                    if (e.key === 'ArrowRight' || e.key === 'PageDown') nextPage();
                    if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevPage();
                    if (e.key === '+' || e.key === '=') zoomIn();
                    if (e.key === '-') zoomOut();
                    if (e.key === '0') resetZoom();
                    if (e.key === 'f' || e.key === 'F') toggleFullscreen();
                }
                if (e.key === 'Escape') {
                    if (!document.getElementById('sidebar-panel').classList.contains('-translate-x-full')) {
                        toggleSidebar(false);
                    }
                    if (!viewPdfViewer.classList.contains('hidden')) {
                        if (isFullscreen) {
                            toggleFullscreen();
                        } else {
                            document.getElementById('close-viewer-btn').click();
                        }
                    }
                }
            });

            // Setup touch gestures
            setupTouchGestures();
        }

        // ============================================
        // INITIALIZE
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            keepScreenAwake();
            initTelegramWebApp();
            mountDashboardInterface();
            mountSidebarNavigation();
            setupEventListeners();
            
            console.log('✅ FreshmanHub initialized');
            console.log('📚 7 Courses loaded');
            console.log('👆 2 fingers: Swipe up/down for pages, Pinch to zoom');
            console.log('💡 Screen wake lock active');
        });
    </script>
</body>
</html>
