<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Freshman Read-Only Course Viewer</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        * {
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-touch-callout: none !important;
            outline: none !important;
            -webkit-tap-highlight-color: transparent;
        }
        body { 
            overflow-x: hidden; 
            touch-action: pan-y; 
            background-color: #05070f !important; 
            color: #f8fafc !important; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }
        .text-gradient {
            background: linear-gradient(to right, #00f2fe, #ff007f, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .glass-effect {
            background: rgba(15, 17, 35, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0f1123;
        }
        ::-webkit-scrollbar-thumb {
            background: #6366f1;
            border-radius: 10px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .course-card {
            animation: fadeIn 0.3s ease-out;
        }
        @supports (padding: max(0px)) {
            .safe-top {
                padding-top: max(env(safe-area-inset-top), 16px);
            }
            .safe-bottom {
                padding-bottom: max(env(safe-area-inset-bottom), 16px);
            }
        }
        .loader {
            border: 3px solid #1e293b;
            border-top: 3px solid #6366f1;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* PDF Viewer Container - Clean & Minimal */
        #pdf-viewer-container {
            background: #0a0c1a;
            overflow: hidden;
            height: 100%;
            width: 100%;
            position: relative;
        }
        #pdf-viewer-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #0a0c1a;
        }
        /* Hide Google Drive UI elements */
        .pdf-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 8px 10px;
            background: #0f1123;
            border-bottom: 1px solid #1e293b;
            flex-wrap: wrap;
        }
        .pdf-controls button {
            padding: 5px 12px;
            border-radius: 8px;
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            font-size: 11px;
            font-weight: bold;
            transition: all 0.2s;
            min-height: 36px;
        }
        .pdf-controls button:active {
            transform: scale(0.95);
        }
        .pdf-controls button:hover {
            background: #2d3748;
            border-color: #6366f1;
        }
        .pdf-controls span {
            color: #94a3b8;
            font-size: 11px;
        }
        /* Hide Google Drive branding */
        .hide-drive-ui iframe {
            filter: brightness(0.95);
        }
        /* Overlay to block clicks on Google Drive elements */
        .drive-blocker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            background: transparent;
        }
        /* Block specific Google Drive elements */
        .drive-blocker.active {
            pointer-events: auto;
            cursor: default;
        }
    </style>
</head>
<body class="bg-[#05070f] text-slate-100">

    <div id="app-root" class="relative min-h-screen flex flex-col max-w-md mx-auto shadow-2xl border-x border-slate-900/60 bg-[#05070f]">
        
        <!-- HEADER -->
        <header class="sticky top-0 z-40 glass-effect border-b border-slate-900/50 p-4 safe-top">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-3">
                    <button id="sidebar-toggle-btn" class="p-2 rounded-xl bg-slate-900/50 border border-slate-800/40 active:scale-95 transition-all hover:border-[#00f2fe]/30">
                        <svg class="w-5 h-5 text-[#00f2fe]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                    <h1 class="text-lg font-black text-gradient tracking-tight">FreshmanHub</h1>
                </div>
                <button id="theme-toggle-btn" class="p-2 rounded-xl bg-slate-900/50 border border-slate-800/40 transition-all text-base active:scale-95 hover:border-[#00f2fe]/30">
                    🌙
                </button>
            </div>
            <div id="search-box-container" class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">🔍</span>
                <input type="text" id="course-filter-input" placeholder="ኮርሶችን ይፍለጉ (Search courses...)" 
                       class="w-full pl-9 pr-4 py-2.5 bg-[#05070f] border border-slate-800 rounded-xl focus:border-[#00f2fe] text-xs font-medium transition-all text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-[#00f2fe]/50">
            </div>
        </header>

        <!-- SIDEBAR -->
        <div id="sidebar-backdrop" class="fixed inset-0 bg-black/80 z-50 opacity-0 pointer-events-none transition-opacity duration-300"></div>
        <aside id="sidebar-panel" class="fixed top-0 bottom-0 left-0 w-72 max-w-[75vw] bg-[#0f1123] z-50 transform -translate-x-full transition-transform duration-300 ease-out border-r border-slate-900 flex flex-col shadow-2xl">
            <div class="p-4 border-b border-slate-900 flex items-center justify-between safe-top">
                <span class="font-black text-sm text-gradient">የኮርሶች ዝርዝር</span>
                <button id="sidebar-close-btn" class="text-slate-400 text-sm p-1.5 hover:text-white transition-colors">✕</button>
            </div>
            <nav id="sidebar-links-target" class="flex-1 overflow-y-auto p-3 space-y-1.5 safe-bottom"></nav>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 p-4 relative z-10">
            <!-- Dashboard -->
            <div id="screen-dashboard" class="space-y-4">
                <div class="p-4 rounded-2xl border border-[#6366f1]/30 bg-gradient-to-br from-[#6366f1]/20 to-[#ff007f]/5">
                    <h2 class="text-sm font-bold text-white">ሰላም ለእናንተ ይሁን 👋</h2>
                    <p class="text-[11px] text-slate-400 mt-1 leading-relaxed">ለዩኒቨርሲቲ አንደኛ አመት ተማሪዎች የተዘጋጁ የትምህርት ማጠቃለያዎች። ፋይሎችን ኮፒ ማድረግ ወይም ማውረድ በጥብቅ የተከለከለ ነው።</p>
                </div>
                <div id="dashboard-grid-container" class="grid grid-cols-1 gap-3"></div>
            </div>

            <!-- PDF VIEWER - Using iframe with clean UI -->
            <div id="screen-pdf-viewer" class="hidden flex flex-col h-[calc(100vh-150px)]">
                <div class="flex items-center justify-between bg-[#0f1123] p-2.5 rounded-t-xl border border-slate-900">
                    <button id="close-viewer-btn" class="flex items-center gap-1 text-xs font-bold text-[#00f2fe] active:scale-95 transition-transform hover:text-white">
                        ⬅ ወደ ኋላ መመለሻ
                    </button>
                    <span id="active-course-banner-text" class="text-[11px] font-bold text-slate-400 truncate max-w-[160px]">Course</span>
                </div>
                
                <!-- Simple Controls -->
                <div class="pdf-controls">
                    <button id="zoom-in-btn" class="text-xs">🔍+</button>
                    <button id="zoom-out-btn" class="text-xs">🔍−</button>
                    <button id="reset-zoom-btn" class="text-xs">⟲ መደበኛ</button>
                    <span id="view-status" class="text-slate-500 text-[10px]">🔒 በተጠበቀ ሁኔታ</span>
                </div>

                <!-- Loading -->
                <div id="pdf-loader" class="flex-1 flex items-center justify-center bg-black/40 rounded-b-xl border border-slate-800 border-t-0">
                    <div class="text-center">
                        <div class="loader mx-auto mb-4"></div>
                        <p class="text-slate-400 text-sm">⏳ ፒዲኤፍ እየተከፈተ ነው... (Loading PDF...)</p>
                        <p class="text-slate-600 text-xs mt-2">ትዕግስት ይስጡ (Please wait)</p>
                    </div>
                </div>

                <!-- PDF Viewer Container -->
                <div id="pdf-viewer-container" class="flex-1 rounded-b-xl border border-slate-900 border-t-0 overflow-hidden bg-[#0a0c1a]">
                    <iframe id="pdf-iframe" src="" class="w-full h-full" allow="autoplay"></iframe>
                    <!-- Blocker overlay to prevent clicking Google Drive elements -->
                    <div id="drive-blocker" class="drive-blocker"></div>
                </div>
            </div>
        </main>

        <footer class="p-3 text-center border-t border-slate-900 bg-slate-950/20 safe-bottom">
            <p class="text-[9px] font-mono tracking-wider text-slate-600">🔒 PROTECTED BY ENCRYPTED READ-ONLY ENGINE</p>
        </footer>
    </div>

    <script>
        // ============================================
        // COURSE DATA - Google Drive Embed Links
        // ============================================
        const APPLICATION_LOCAL_DATABASE = [
            { 
                id: "logic", 
                name: "Logic and Critical Thinking", 
                amharicName: "ሎጂክ እና ሂሳባዊ አስተሳሰብ", 
                emoji: "🧠", 
                // Using embed URL (preview mode)
                url: "https://drive.google.com/file/d/1ALxgT1Uy7GgzpgAqfYejyfbpo1XMw9Rp/preview"
            },
            { 
                id: "psychology", 
                name: "Psychology", 
                amharicName: "ሳይኮሎጂ (የስነ-ልቦና ትምህርት)", 
                emoji: "👥", 
                url: "https://drive.google.com/file/d/1DFuPHZtj1YWyH0xq8Dp6Il24ice54O1p/preview"
            },
            { 
                id: "anthropology", 
                name: "Anthropology", 
                amharicName: "አንትሮፖሎጂ (የሰው ልጅ አመጣጥ ስነ-ባህል)", 
                emoji: "🦴", 
                url: "https://drive.google.com/file/d/1h8sNuyWE2ANft8JF7e4LugefEFSeBga8/preview"
            },
            { 
                id: "economics", 
                name: "Economics", 
                amharicName: "ኢኮኖሚክስ (የምጣኔ ሀብት ትምህርት)", 
                emoji: "📈", 
                url: "https://drive.google.com/file/d/1TlcMXFBfeM8Eg0Bf5Ij_jJvNXzydGCvL/preview"
            },
            { 
                id: "emerging_tech", 
                name: "Emerging Technology", 
                amharicName: "ኤመርጂንግ ቴክኖሎጂ (አዳዲስ ቴክኖሎጂዎች)", 
                emoji: "🤖", 
                url: "https://drive.google.com/file/d/1HiwRvpQqsOOVrf6badGtwI7RSzvYO14w/preview"
            },
            { 
                id: "global_trends", 
                name: "Global Trends", 
                amharicName: "ግሎባል ትሬንድስ (አለም አቀፋዊ ሁኔታዎች)", 
                emoji: "🌍", 
                url: "https://drive.google.com/file/d/15g-oc_cc3O-qAJwCS_pvT_pk96-QTkk-/preview"
            },
            { 
                id: "civics", 
                name: "Civics", 
                amharicName: "ሲቪክስና ስነ-ዜጋ", 
                emoji: "⚖️", 
                url: "https://drive.google.com/file/d/1nXGQV88ovouctmtLX4uqG6fXWYSZRJIx/preview"
            }
        ];

        // ============================================
        // DOM REFERENCES
        // ============================================
        const dashboardGrid = document.getElementById('dashboard-grid-container');
        const sidebarLinksTarget = document.getElementById('sidebar-links-target');
        const searchInput = document.getElementById('course-filter-input');
        const viewDashboard = document.getElementById('screen-dashboard');
        const viewPdfViewer = document.getElementById('screen-pdf-viewer');
        const wrapperSearchBox = document.getElementById('search-box-container');
        const activeCourseText = document.getElementById('active-course-banner-text');
        const pdfLoader = document.getElementById('pdf-loader');
        const pdfIframe = document.getElementById('pdf-iframe');
        const viewerContainer = document.getElementById('pdf-viewer-container');
        const driveBlocker = document.getElementById('drive-blocker');
        const viewStatus = document.getElementById('view-status');

        // ============================================
        // STATE
        // ============================================
        let currentCourse = null;
        let currentZoom = 1;

        // ============================================
        // OPEN COURSE VIEWER
        // ============================================
        function openCourseViewer(course) {
            currentCourse = course;
            
            viewDashboard.classList.add('hidden');
            wrapperSearchBox.classList.add('hidden');
            viewPdfViewer.classList.remove('hidden');
            activeCourseText.innerText = `${course.emoji} ${course.name}`;
            
            // Show loader
            pdfLoader.classList.remove('hidden');
            pdfIframe.style.display = 'none';
            
            // Reset zoom
            currentZoom = 1;
            pdfIframe.style.transform = `scale(${currentZoom})`;
            pdfIframe.style.transformOrigin = 'top left';
            
            // Load PDF in iframe
            setTimeout(() => {
                pdfIframe.src = course.url;
                
                // Hide loader when iframe loads
                pdfIframe.onload = function() {
                    pdfLoader.classList.add('hidden');
                    pdfIframe.style.display = 'block';
                    
                    // Enable blocker after iframe loads
                    setTimeout(() => {
                        driveBlocker.classList.add('active');
                        console.log('🔒 Google Drive UI blocked');
                    }, 1000);
                    
                    viewStatus.textContent = '🔒 በተጠበቀ ሁኔታ';
                };
                
                // Fallback: hide loader after 8 seconds
                setTimeout(() => {
                    if (!pdfLoader.classList.contains('hidden')) {
                        pdfLoader.classList.add('hidden');
                        pdfIframe.style.display = 'block';
                        driveBlocker.classList.add('active');
                    }
                }, 8000);
            }, 500);
        }

        // ============================================
        // ZOOM FUNCTIONS
        // ============================================
        function zoomIn() {
            currentZoom = Math.min(currentZoom + 0.1, 2);
            pdfIframe.style.transform = `scale(${currentZoom})`;
            pdfIframe.style.transformOrigin = 'top left';
            viewStatus.textContent = `🔍 ${Math.round(currentZoom * 100)}%`;
        }

        function zoomOut() {
            currentZoom = Math.max(currentZoom - 0.1, 0.5);
            pdfIframe.style.transform = `scale(${currentZoom})`;
            pdfIframe.style.transformOrigin = 'top left';
            viewStatus.textContent = `🔍 ${Math.round(currentZoom * 100)}%`;
        }

        function resetZoom() {
            currentZoom = 1;
            pdfIframe.style.transform = `scale(${currentZoom})`;
            pdfIframe.style.transformOrigin = 'top left';
            viewStatus.textContent = '🔒 በተጠበቀ ሁኔታ';
        }

        // ============================================
        // BLOCK GOOGLE DRIVE EXTERNAL LINKS
        // ============================================
        function blockGoogleDriveLinks() {
            // Block all link clicks to Google Drive
            document.addEventListener('click', function(e) {
                let target = e.target;
                while (target && target !== document) {
                    if (target.tagName === 'A' && target.href && target.href.includes('drive.google.com')) {
                        e.preventDefault();
                        e.stopPropagation();
                        console.log('🚫 Blocked Google Drive link');
                        return false;
                    }
                    target = target.parentElement;
                }
            }, true);
        }

        // ============================================
        // DASHBOARD MOUNT
        // ============================================
        function mountDashboardInterface(query = '') {
            dashboardGrid.innerHTML = '';
            const normalizedQuery = query.toLowerCase().trim();
            
            const filteredCourses = APPLICATION_LOCAL_DATABASE.filter(course => 
                course.name.toLowerCase().includes(normalizedQuery) || 
                course.amharicName.includes(normalizedQuery)
            );

            if (filteredCourses.length === 0) {
                dashboardGrid.innerHTML = `
                    <div class="p-8 text-center rounded-xl bg-[#0f1123] border border-slate-900">
                        <p class="text-slate-400 text-sm">😕 ምንም ኮርስ አልተገኘም</p>
                        <p class="text-slate-600 text-xs mt-1">No courses found</p>
                    </div>
                `;
                return;
            }

            filteredCourses.forEach((course, index) => {
                const uiTileNode = document.createElement('div');
                uiTileNode.className = `course-card p-4 rounded-xl bg-[#0f1123] border border-slate-900 flex items-center justify-between cursor-pointer active:scale-[0.98] transition-all duration-200 shadow-md group hover:border-[#00f2fe]/60`;
                uiTileNode.style.animationDelay = `${index * 0.05}s`;
                
                uiTileNode.innerHTML = `
                    <div class="flex items-center gap-3.5">
                        <div class="text-2xl p-2 rounded-lg bg-slate-900 border border-slate-800/40">${course.emoji}</div>
                        <div>
                            <h4 class="text-sm font-bold text-slate-100 group-hover:text-[#00f2fe] transition-colors">${course.name}</h4>
                            <p class="text-[10px] text-slate-400 mt-0.5">${course.amharicName}</p>
                        </div>
                    </div>
                    <span class="text-[#00f2fe] font-bold text-xs opacity-70 group-hover:opacity-100">📖 አንብብ</span>
                `;
                
                uiTileNode.addEventListener('click', () => openCourseViewer(course));
                dashboardGrid.appendChild(uiTileNode);
            });
        }

        // ============================================
        // SIDEBAR NAVIGATION
        // ============================================
        function mountSidebarNavigation() {
            sidebarLinksTarget.innerHTML = '';
            
            APPLICATION_LOCAL_DATABASE.forEach(course => {
                const navRowElement = document.createElement('button');
                navRowElement.className = "w-full text-left p-3 rounded-xl bg-slate-900/20 hover:bg-slate-800/50 border border-slate-800/40 transition-all flex items-center gap-3 active:scale-[0.98]";
                navRowElement.innerHTML = `
                    <span class="text-xl">${course.emoji}</span>
                    <span class="text-xs font-bold text-slate-300 truncate flex-1">${course.name}</span>
                    <span class="text-[10px] text-slate-500">→</span>
                `;
                navRowElement.addEventListener('click', () => {
                    toggleSidebar(false);
                    openCourseViewer(course);
                });
                sidebarLinksTarget.appendChild(navRowElement);
            });
        }

        // ============================================
        // SIDEBAR TOGGLE
        // ============================================
        function toggleSidebar(show) {
            const sidebar = document.getElementById('sidebar-panel');
            const backdrop = document.getElementById('sidebar-backdrop');
            
            if (show) {
                sidebar.classList.remove('-translate-x-full');
                backdrop.classList.remove('opacity-0', 'pointer-events-none');
                document.body.style.overflow = 'hidden';
            } else {
                sidebar.classList.add('-translate-x-full');
                backdrop.classList.add('opacity-0', 'pointer-events-none');
                document.body.style.overflow = '';
            }
        }

        // ============================================
        // THEME TOGGLE
        // ============================================
        let isDarkTheme = true;

        function toggleTheme() {
            const btn = document.getElementById('theme-toggle-btn');
            const body = document.body;
            const appRoot = document.getElementById('app-root');
            
            if (isDarkTheme) {
                btn.textContent = '☀️';
                body.style.backgroundColor = '#f1f5f9';
                body.style.color = '#0f172a';
                appRoot.style.backgroundColor = '#f1f5f9';
                appRoot.style.borderColor = '#e2e8f0';
                isDarkTheme = false;
            } else {
                btn.textContent = '🌙';
                body.style.backgroundColor = '#05070f';
                body.style.color = '#f8fafc';
                appRoot.style.backgroundColor = '#05070f';
                appRoot.style.borderColor = '#1e293b';
                isDarkTheme = true;
            }
        }

        // ============================================
        // TELEGRAM WEBAPP
        // ============================================
        function initTelegramWebApp() {
            if (window.Telegram && window.Telegram.WebApp) {
                try {
                    Telegram.WebApp.ready();
                    Telegram.WebApp.expand();
                    Telegram.WebApp.enableClosingConfirmation();
                    console.log('✅ Telegram WebApp initialized');
                } catch (error) {
                    console.warn('⚠️ Telegram WebApp error:', error);
                }
            }
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================
        function setupEventListeners() {
            searchInput.addEventListener('input', (e) => {
                mountDashboardInterface(e.target.value);
            });

            document.getElementById('sidebar-toggle-btn').addEventListener('click', () => {
                toggleSidebar(true);
            });

            document.getElementById('sidebar-close-btn').addEventListener('click', () => {
                toggleSidebar(false);
            });

            document.getElementById('sidebar-backdrop').addEventListener('click', () => {
                toggleSidebar(false);
            });

            document.getElementById('close-viewer-btn').addEventListener('click', () => {
                viewPdfViewer.classList.add('hidden');
                viewDashboard.classList.remove('hidden');
                wrapperSearchBox.classList.remove('hidden');
                pdfIframe.src = '';
                pdfIframe.style.display = 'none';
                driveBlocker.classList.remove('active');
                currentZoom = 1;
                mountDashboardInterface(searchInput.value);
            });

            document.getElementById('theme-toggle-btn').addEventListener('click', toggleTheme);

            // Zoom controls
            document.getElementById('zoom-in-btn').addEventListener('click', zoomIn);
            document.getElementById('zoom-out-btn').addEventListener('click', zoomOut);
            document.getElementById('reset-zoom-btn').addEventListener('click', resetZoom);

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (!viewPdfViewer.classList.contains('hidden')) {
                    if (e.key === '+' || e.key === '=') zoomIn();
                    if (e.key === '-') zoomOut();
                    if (e.key === '0') resetZoom();
                }
                if (e.key === 'Escape') {
                    if (!document.getElementById('sidebar-panel').classList.contains('-translate-x-full')) {
                        toggleSidebar(false);
                    }
                    if (!viewPdfViewer.classList.contains('hidden')) {
                        document.getElementById('close-viewer-btn').click();
                    }
                }
            });
        }

        // ============================================
        // INITIALIZE
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            // Block Google Drive links
            blockGoogleDriveLinks();
            
            // Initialize Telegram
            initTelegramWebApp();
            
            // Mount UI
            mountDashboardInterface('');
            mountSidebarNavigation();
            setupEventListeners();
            
            console.log('✅ FreshmanHub initialized - Google Drive blocked');
            console.log(`📚 ${APPLICATION_LOCAL_DATABASE.length} courses loaded`);
        });
    </script>
</body>
</html>
